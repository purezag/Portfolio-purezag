<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Beatframe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Beatframe: o ritmo de uma edição que funciona, com o seu material. Lê cortes, batidas e o tempo das legendas de uma referência e monta a sua versão.">
<meta name="theme-color" content="#F2F0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..500&amp;display=swap">
<style>
/* ==========================================================================
   Beatframe · protótipo front-end
   Tokens do manual de marca v1.0 ([08] tokens por tema, [15] código e regras)
   Layout: barra fixa de 56/64 px, conteúdo até 1440 px em 12 colunas,
   papel creme (ou branco) com tinta grafite; escuro em grafite 950.
   A única cor da tela é o material do usuário.
   ========================================================================== */

/* claro · creme (padrão) */
:root{
  --bg:#F2F0E9;--sheet:#FAF9F5;--well:#E9E6DE;--rule:#DAD6CC;--rule-2:#BFBAAE;--rule-3:#8E897F;
  --ink:#1D1E20;--ink-2:#46484C;--ink-3:#616367;--on-ink:#FAF9F5;--danger:#A1271F;
  --ink-hover:#3A3C40;--scrim:rgba(29,30,32,.42);
  --stage:#111214;--cream:#EEEBE3;
  color-scheme:light;
}
/* escuro pelo sistema (quando o visualizador não escolheu o claro) */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17181A;--sheet:#1E1F22;--well:#26272B;--rule:#303135;--rule-2:#46474C;--rule-3:#707176;
    --ink:#EEEBE3;--ink-2:#B7B4AB;--ink-3:#96948D;--on-ink:#17181A;--danger:#F0897D;
    --ink-hover:#D6D2C8;--scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
/* escuro escolhido no visualizador */
:root[data-theme="dark"]{
  --bg:#17181A;--sheet:#1E1F22;--well:#26272B;--rule:#303135;--rule-2:#46474C;--rule-3:#707176;
  --ink:#EEEBE3;--ink-2:#B7B4AB;--ink-3:#96948D;--on-ink:#17181A;--danger:#F0897D;
  --ink-hover:#D6D2C8;--scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
/* escolha feita dentro do app (Conta › Tema): vale sobre o sistema */
body[data-mode="light"]{
  --bg:#F2F0E9;--sheet:#FAF9F5;--well:#E9E6DE;--rule:#DAD6CC;--rule-2:#BFBAAE;--rule-3:#8E897F;
  --ink:#1D1E20;--ink-2:#46484C;--ink-3:#616367;--on-ink:#FAF9F5;--danger:#A1271F;
  --ink-hover:#3A3C40;--scrim:rgba(29,30,32,.42);
  color-scheme:light;
}
body[data-mode="light"][data-papel="branco"]{
  --bg:#F6F6F4;--sheet:#FFFFFF;--well:#ECECE9;--rule:#DEDEDA;--rule-2:#C3C3BE;--rule-3:#8C8C87;--on-ink:#FFFFFF;
}
body[data-mode="dark"]{
  --bg:#17181A;--sheet:#1E1F22;--well:#26272B;--rule:#303135;--rule-2:#46474C;--rule-3:#707176;
  --ink:#EEEBE3;--ink-2:#B7B4AB;--ink-3:#96948D;--on-ink:#17181A;--danger:#F0897D;
  --ink-hover:#D6D2C8;--scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

/* tokens derivados: ficam no body para seguir a tinta do tema em uso */
body{
  --tint:color-mix(in oklab,var(--ink) 5%,transparent);
  --tint-2:color-mix(in oklab,var(--ink) 9%,transparent);
  --hatch:repeating-linear-gradient(135deg,var(--rule-2) 0 1px,transparent 1px 7px);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --r-media:3px;--r-ctrl:4px;--r-panel:8px;--r-sheet:12px;
  --ease:cubic-bezier(.2,0,0,1);
  --ease-exit:cubic-bezier(.4,0,1,1);
  --spring:cubic-bezier(.3,1.25,.5,1);
  --t-micro:160ms;--t-panel:320ms;--t-exit:200ms;
  --nav-h:56px;
  --gutter:16px;
  --max:1440px;
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
/* mola do manual: rigidez 260, amortecimento 26 */
@supports (transition-timing-function:linear(0,1)){
  body{--spring:linear(0,.0437,.1465,.2763,.4116,.5394,.6524,.7475,.8244,.8842,.929,.9614,.9838,.9984,1.0072,1.0118,1.0137,1.0136,1.0125,1.0109,1.009,1.0072,1.0055,1.0041,1.0029,1.002,1.0012,1.0007,1)}
}
@media (min-width:640px){body{--gutter:24px}}
@media (min-width:1024px){body{--nav-h:64px;--gutter:32px}}

/* faixa da área segura no topo do telefone */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg);pointer-events:none}

/* ---------- base ---------- */
:where(.ca,.ca-ov,.pl) :where(*,*::before,*::after){box-sizing:border-box}
:where(.ca,.ca-ov) :where(img,video,canvas){display:block;max-width:100%}
:where(.ca,.ca-ov) :where(button,input,textarea,select){font:inherit;color:inherit;letter-spacing:inherit}
:where(.ca,.ca-ov) :where(h1,h2,h3,h4,p,ol,ul,dl,dd,figure,blockquote){margin:0}
:where(.ca,.ca-ov) :where(ol,ul){padding:0;list-style:none}
:where(.ca,.ca-ov) :where(a){color:inherit}
:where(.ca,.ca-ov) :where(table){border-collapse:collapse;width:100%}
.ca{position:relative;min-height:100vh;min-height:100dvh}
.ca :focus-visible,.ca-ov :focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
::selection{background:var(--ink);color:var(--on-ink)}
.ca-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ca-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ca-skip{position:fixed;left:12px;top:-60px;z-index:100;padding:10px 14px;border-radius:var(--r-ctrl);background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:500;text-decoration:none;transition:top var(--t-micro) var(--ease)}
.ca-skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}

/* largura e calha */
.ca-wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.ca-wrap--read{max-width:calc(760px + 2 * var(--gutter))}
.ca-wrap--mid{max-width:calc(1120px + 2 * var(--gutter))}

/* ícones: traço 1,5 px, ponta quadrada, grade de 20 px */
.ca-i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.ca-i--sm{width:16px;height:16px}
.ca-i--xs{width:14px;height:14px}

/* tipografia */
.ca-display{font-size:clamp(42px,11.4vw,52px);line-height:1;font-weight:500;letter-spacing:-.048em;text-wrap:balance}
@media (min-width:1024px){.ca-display{font-size:clamp(56px,3.9vw,74px)}}
.ca-h1{font-size:clamp(34px,8vw,44px);line-height:1.04;font-weight:500;letter-spacing:-.04em;text-wrap:balance}
@media (min-width:1024px){.ca-h1{font-size:clamp(44px,3.2vw,56px)}}
.ca-h2{font-size:24px;line-height:1.15;font-weight:500;letter-spacing:-.025em;text-wrap:balance}
.ca-h3{font-size:18px;line-height:1.3;font-weight:500;letter-spacing:-.018em}
.ca-lede{max-width:52ch;color:var(--ink-2);font-size:15px;line-height:1.55;text-wrap:pretty}
@media (min-width:1024px){.ca-lede{font-size:16px}}
.ca-body{font-size:15px;line-height:1.6;color:var(--ink-2)}
.ca-small{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.ca-mono{font-family:var(--mono);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
.ca-kicker{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ca-idx{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ca-num{font-variant-numeric:tabular-nums}

/* terminal: linha de comando digitada */
.ca-cmd{display:flex;align-items:center;min-height:20px;margin:0;font-family:var(--mono);font-size:12px;line-height:1;color:var(--ink);white-space:pre;overflow:hidden}
.ca-cmd__p{flex:none;color:var(--ink-3)}
.ca-ch{position:relative;opacity:0;animation:ca-on 1ms linear forwards;animation-delay:calc(var(--d0,.35s) + var(--i) * 34ms)}
.ca-ch::after{content:"";position:absolute;left:100%;top:-.2em;bottom:-.24em;width:.62em;background:var(--ink);opacity:0;animation:ca-caret-step 34ms linear forwards;animation-delay:calc(var(--d0,.35s) + var(--i) * 34ms)}
.ca-caret{display:inline-block;flex:none;width:.62em;height:1.44em;background:var(--ink);opacity:0;animation:ca-cursor3 3s linear forwards;animation-delay:calc(var(--d0,.35s) + var(--n,0) * 34ms)}

/* ---------- botões e links ---------- */
.ca-btn{appearance:none;border:0;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 18px;border-radius:var(--r-ctrl);font-size:14.5px;font-weight:500;line-height:1;letter-spacing:-.01em;white-space:nowrap;text-decoration:none;cursor:pointer;user-select:none;transition:background-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease),transform var(--t-micro) var(--ease),opacity var(--t-micro) var(--ease)}
.ca-btn:active:not(:disabled){transform:translateY(1px)}
.ca-btn--primary{background:var(--ink);color:var(--on-ink)}
.ca-btn--primary:hover:not(:disabled){background:var(--ink-hover)}
.ca-btn:disabled,.ca-btn[aria-disabled="true"]{cursor:not-allowed;background:color-mix(in oklab,var(--ink) 30%,var(--bg));color:var(--on-ink);box-shadow:none}
.ca-btn--line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-3)}
.ca-btn--line:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--ink)}
.ca-btn--line:disabled{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule-2)}
.ca-btn--ghost{background:transparent;color:var(--ink-2);padding:0 12px}
.ca-btn--ghost:hover:not(:disabled){background:var(--tint);color:var(--ink)}
.ca-btn--ghost:disabled{background:transparent;color:var(--ink-3)}
.ca-btn--danger{background:var(--danger);color:#fff}
body[data-mode="dark"] .ca-btn--danger{color:#17181A}
.ca-btn--danger:hover:not(:disabled){background:color-mix(in oklab,var(--danger) 86%,var(--ink))}
.ca-btn--sm{min-height:40px;padding:0 14px;font-size:14px}
.ca-btn--xs{min-height:32px;padding:0 10px;font-size:13px;gap:6px}
.ca-btn--block{width:100%}
.ca-btn--lg{min-height:52px;padding:0 22px;font-size:15.5px}
.ca-btn__k{display:none;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.06em;opacity:.55}
@media (min-width:1024px){.ca-btn__k{display:inline}}
.ca-btn__end{margin-left:auto}
.ca-btn.is-busy{color:transparent!important;pointer-events:none}
.ca-btn.is-busy::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--on-ink);animation:ca-turn 1.2s var(--ease) infinite}
.ca-btn--line.is-busy::after,.ca-btn--ghost.is-busy::after{background:var(--ink)}

.ca-link{appearance:none;border:0;background:transparent;padding:0;position:relative;min-height:32px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:color-mix(in oklab,currentColor 45%,transparent);cursor:pointer;white-space:nowrap;transition:text-decoration-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease)}
.ca-link::before{content:"";position:absolute;inset:-6px -4px}
.ca-link:hover{text-decoration-color:currentColor}
.ca-link--quiet{color:var(--ink-3)}
.ca-link--quiet:hover{color:var(--ink-2)}
.ca-link--plain{text-decoration:none}
.ca-link--plain:hover{text-decoration:underline;text-underline-offset:4px}
.ca-link--sm{font-size:13px;min-height:28px}
.ca-link:has(:focus-visible){outline:1.5px solid var(--ink);outline-offset:2px;border-radius:2px}
.ca-inl{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in oklab,currentColor 45%,transparent);cursor:pointer;background:none;border:0;padding:0;font:inherit}
.ca-inl:hover{text-decoration-color:currentColor}

.ca-ibtn{appearance:none;border:0;background:transparent;color:var(--ink-2);width:40px;height:40px;flex:none;border-radius:var(--r-ctrl);display:inline-grid;place-items:center;cursor:pointer;position:relative;transition:background-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease)}
.ca-ibtn:hover{background:var(--tint);color:var(--ink)}
.ca-ibtn .ca-i{width:18px;height:18px}
.ca-ibtn--sm{width:32px;height:32px}
.ca-ibtn--sm .ca-i{width:16px;height:16px}

/* ---------- erro e aviso ---------- */
.ca-err{display:flex;gap:10px;align-items:baseline;margin-top:10px;color:var(--danger);font-size:13.5px;line-height:1.45;animation:ca-rise var(--t-panel) var(--ease) backwards}
.ca-err::before{content:"";flex:none;width:8px;height:8px;background:currentColor;transform:translateY(-1px)}
.ca-note{display:flex;gap:10px;align-items:baseline;padding:12px 14px;border-radius:var(--r-ctrl);background:var(--well);color:var(--ink-2);font-size:13.5px;line-height:1.5}
.ca-note::before{content:"";flex:none;width:8px;height:8px;box-shadow:inset 0 0 0 1.25px currentColor;transform:translateY(-1px)}
.ca-note--warn{background:color-mix(in oklab,var(--danger) 9%,var(--sheet));color:var(--ink)}
.ca-note--warn::before{background:var(--danger);box-shadow:none}
.ca-note b{font-weight:600;color:var(--ink)}

/* ---------- quadrado de estado · [10] ---------- */
.ca-state{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:24px;font-family:var(--mono);font-size:12px;line-height:1;color:var(--ink-2);white-space:nowrap}
.ca-state i,.ca-sq{display:inline-block;flex:none;width:8px;height:8px;box-shadow:inset 0 0 0 1.25px currentColor}
.ca-state.is-done{color:var(--ink)}
.ca-state.is-done i,.ca-sq.is-done{background:currentColor;box-shadow:none}
.ca-state.is-busy{color:var(--ink)}
.ca-state.is-busy i,.ca-sq.is-busy{background:currentColor;box-shadow:none;transform:rotate(45deg) scale(.86);animation:ca-turn 1.2s var(--ease) infinite}
.ca-state.is-warn{color:var(--danger)}
.ca-state.is-warn i,.ca-sq.is-warn{background:currentColor;box-shadow:none}

/* rótulo pequeno em contorno */
.ca-tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--rule-2);font-family:var(--mono);font-size:10.5px;line-height:1;color:var(--ink-2);white-space:nowrap}
.ca-tag--ink{background:var(--ink);color:var(--on-ink);box-shadow:none}
.ca-tag--well{background:var(--well);box-shadow:none}
.ca-tag--warn{color:var(--danger);box-shadow:inset 0 0 0 1px currentColor}

/* ---------- campos ---------- */
.ca-fld{display:grid;gap:7px;min-width:0}
.ca-fld__l{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:500;color:var(--ink)}
.ca-fld__l small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3)}
.ca-fld__hint{font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.ca-field{display:block;width:100%;min-height:46px;border:0;border-radius:var(--r-ctrl);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule-3);padding:12px 14px;font-size:15px;line-height:1.4;color:var(--ink);transition:box-shadow var(--t-micro) var(--ease),background-color var(--t-micro) var(--ease)}
.ca-field::placeholder{color:var(--ink-3)}
.ca-field:hover{box-shadow:inset 0 0 0 1px var(--ink-2)}
.ca-field:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.ca-field[aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--danger)}
.ca-field:disabled,.ca-field[readonly]{background:var(--well);box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-2)}
textarea.ca-field{min-height:120px;resize:vertical;line-height:1.55}
select.ca-field{appearance:none;padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(-45deg,transparent 50%,var(--ink-2) 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
.ca-inwrap{position:relative;display:flex;align-items:center}
.ca-inwrap .ca-field{padding-right:52px}
.ca-inwrap__btn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.ca-inwrap--lead .ca-field{padding-left:42px}
.ca-inwrap__lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}

/* força da senha */
.ca-pw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:2px}
.ca-pw i{height:2px;background:var(--rule-2);transition:background-color var(--t-panel) var(--ease)}
.ca-pw[data-s="1"] i:nth-child(-n+1),.ca-pw[data-s="2"] i:nth-child(-n+2),.ca-pw[data-s="3"] i:nth-child(-n+3),.ca-pw[data-s="4"] i{background:var(--ink)}
.ca-pw[data-s="1"] i:nth-child(1){background:var(--danger)}
.ca-pwrules{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.ca-pwrules span{display:inline-flex;align-items:center;gap:6px;transition:color var(--t-micro) var(--ease)}
.ca-pwrules span::before{content:"";width:7px;height:7px;box-shadow:inset 0 0 0 1.25px currentColor;transition:background-color var(--t-micro) var(--ease)}
.ca-pwrules span.is-on{color:var(--ink)}
.ca-pwrules span.is-on::before{background:currentColor;box-shadow:none}

/* código de 6 dígitos */
.ca-otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:360px}
.ca-otp input{width:100%;min-width:0;height:54px;border:0;border-radius:var(--r-ctrl);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule-3);text-align:center;font-family:var(--mono);font-size:22px;color:var(--ink);transition:box-shadow var(--t-micro) var(--ease),transform var(--t-micro) var(--ease)}
.ca-otp input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.ca-otp input.is-filled{box-shadow:inset 0 0 0 1px var(--ink-2)}
.ca-otp.is-error input{box-shadow:inset 0 0 0 1.5px var(--danger);animation:ca-shake .32s var(--ease)}

/* caixa de seleção · folha de direitos */
.ca-checks{border-top:1px solid var(--rule)}
.ca-check{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:13px 2px;border-bottom:1px solid var(--rule);cursor:pointer}
.ca-check--bare{border-bottom:0;padding:6px 0}
.ca-check input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ca-check:has(:focus-visible){outline:1.5px solid var(--ink);outline-offset:2px}
.ca-box{width:20px;height:20px;border-radius:3px;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--rule-3);transition:background-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
.ca-box .ca-i{width:14px;height:14px;stroke-width:2;transform:scale(.6);opacity:0;transition:transform var(--t-micro) var(--spring),opacity var(--t-micro) var(--ease)}
.ca-check:hover .ca-box{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.ca-check.is-on .ca-box{background:var(--ink);color:var(--on-ink);box-shadow:none}
.ca-check.is-on .ca-box .ca-i{transform:none;opacity:1}
.ca-check.is-invalid .ca-box{box-shadow:inset 0 0 0 1.5px var(--danger)}
.ca-check__l{display:block;font-size:14.5px;line-height:1.4;color:var(--ink)}
.ca-check__l a,.ca-check__l .ca-inl{position:relative;z-index:1}
.ca-check__s{display:block;margin-top:3px;font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--ink-3);overflow-wrap:anywhere}
.ca-check--sm .ca-check__l{font-size:13.5px}

/* rádio em lista */
.ca-radios{display:grid;gap:6px}
.ca-radio{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:var(--r-ctrl);box-shadow:inset 0 0 0 1px var(--rule-2);cursor:pointer;transition:box-shadow var(--t-micro) var(--ease),background-color var(--t-micro) var(--ease)}
.ca-radio:hover{box-shadow:inset 0 0 0 1px var(--ink-2)}
.ca-radio input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ca-radio:has(:focus-visible){outline:1.5px solid var(--ink);outline-offset:2px}
.ca-radio__dot{width:18px;height:18px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--rule-3);display:grid;place-items:center;transition:box-shadow var(--t-micro) var(--ease)}
.ca-radio__dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform var(--t-micro) var(--spring)}
.ca-radio.is-on{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--sheet)}
.ca-radio.is-on .ca-radio__dot{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ca-radio.is-on .ca-radio__dot::after{transform:none}
.ca-radio__l{display:block;font-size:14.5px;font-weight:500;line-height:1.35}
.ca-radio__s{display:block;margin-top:2px;font-size:13px;line-height:1.45;color:var(--ink-2)}

/* interruptor */
.ca-sw{position:relative;display:inline-flex;align-items:center;flex:none;width:40px;height:24px;border-radius:12px;background:var(--rule-2);cursor:pointer;transition:background-color var(--t-micro) var(--ease)}
.ca-sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ca-sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--sheet);transition:transform var(--t-panel) var(--spring)}
.ca-sw.is-on{background:var(--ink)}
.ca-sw.is-on::after{transform:translateX(16px);background:var(--on-ink)}
.ca-sw.is-locked{opacity:.55;cursor:not-allowed}
.ca-sw.is-locked input{cursor:not-allowed}
.ca-sw:has(:focus-visible){outline:1.5px solid var(--ink);outline-offset:2px}

/* segmentado com indicador que desliza */
.ca-segm{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:calc(var(--r-ctrl) + 2px);background:var(--well)}
.ca-segm__ind{position:absolute;left:0;top:3px;bottom:3px;width:var(--w,0);transform:translateX(var(--x,0));border-radius:var(--r-ctrl);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule-2);transition:transform var(--t-panel) var(--spring),width var(--t-panel) var(--spring)}
.ca-segm button{appearance:none;border:0;background:transparent;position:relative;z-index:1;min-height:34px;padding:0 14px;border-radius:var(--r-ctrl);font-size:13.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;cursor:pointer;transition:color var(--t-micro) var(--ease)}
.ca-segm button:hover{color:var(--ink-2)}
.ca-segm button[aria-pressed="true"]{color:var(--ink)}
.ca-segm button small{margin-left:6px;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--ink-3)}
.ca-segm--sm button{min-height:28px;padding:0 10px;font-size:12.5px}

/* segmentado em mono (monitor) */
.ca-seg{display:inline-flex;align-items:center;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.ca-seg button{appearance:none;border:0;background:transparent;position:relative;min-height:36px;padding:0 3px;font:inherit;color:var(--ink-3);cursor:pointer;transition:color var(--t-micro) var(--ease)}
.ca-seg button::before{content:"";position:absolute;inset:-4px -2px}
.ca-seg button:hover{color:var(--ink-2)}
.ca-seg button[aria-pressed="true"]{color:var(--ink)}
.ca-seg i{font-style:normal;color:var(--ink-3);padding:0 5px}

/* abas com sublinhado que desliza */
.ca-tabs{position:relative;display:flex;align-items:stretch;gap:2px;min-width:0}
.ca-tabs__ind{position:absolute;left:0;bottom:-1px;height:2px;width:var(--w,0);transform:translateX(var(--x,0));background:var(--ink);transition:transform var(--t-panel) var(--spring),width var(--t-panel) var(--spring)}
.ca-tab{appearance:none;border:0;background:transparent;position:relative;display:inline-flex;align-items:center;gap:7px;padding:0 12px;min-height:44px;color:var(--ink-3);font-size:14.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;text-decoration:none;transition:color var(--t-micro) var(--ease)}
.ca-tab:hover{color:var(--ink-2)}
.ca-tab[aria-current="page"],.ca-tab[aria-selected="true"]{color:var(--ink)}
.ca-tab__i{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3)}
.ca-tab[aria-current="page"] .ca-tab__i{color:var(--ink-2)}
.ca-soon{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:400;line-height:1;padding:3px 6px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-2)}

/* medidor de créditos */
.ca-meter{position:relative;height:4px;overflow:hidden;background:var(--hatch);border-radius:1px}
.ca-meter i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .6s var(--ease)}

/* avatar */
.ca-av{position:relative;flex:none;display:inline-grid;place-items:center;width:var(--s,32px);height:var(--s,32px);border-radius:50%;overflow:hidden;background:var(--av,#8C6D4B);color:#FAF9F5;font-size:calc(var(--s,32px) * .38);font-weight:600;letter-spacing:-.02em;line-height:1;user-select:none}
.ca-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ca-av::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* esqueleto de carregamento */
.ca-skel{position:relative;overflow:hidden;border-radius:var(--r-media);background:var(--well)}
.ca-skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--sheet) 70%,transparent),transparent);animation:ca-shimmer 1.4s var(--ease) infinite}

/* visor · cantos de enquadramento */
.ca-vf{--c:var(--rule-3);--cl:14px;--cw:1.5px;--fill:var(--well);
  background:
    linear-gradient(var(--c),var(--c)) left top/var(--cl) var(--cw) no-repeat,
    linear-gradient(var(--c),var(--c)) left top/var(--cw) var(--cl) no-repeat,
    linear-gradient(var(--c),var(--c)) right top/var(--cl) var(--cw) no-repeat,
    linear-gradient(var(--c),var(--c)) right top/var(--cw) var(--cl) no-repeat,
    linear-gradient(var(--c),var(--c)) left bottom/var(--cl) var(--cw) no-repeat,
    linear-gradient(var(--c),var(--c)) left bottom/var(--cw) var(--cl) no-repeat,
    linear-gradient(var(--c),var(--c)) right bottom/var(--cl) var(--cw) no-repeat,
    linear-gradient(var(--c),var(--c)) right bottom/var(--cw) var(--cl) no-repeat,
    var(--fill)}

/* símbolo e assinatura */
.ca-sym{display:block;flex:none;fill:currentColor;overflow:visible}
.ca-lk{display:inline-flex;align-items:baseline;font-size:var(--fs,18px);line-height:1;font-weight:600;letter-spacing:-.045em;white-space:nowrap;color:inherit;text-decoration:none}
.ca-lk .ca-sym{width:.849em;height:1.2em;margin-right:.4em;transform:translateY(.24em)}

/* copiar texto */
.ca-copyf{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 14px;border-radius:var(--r-ctrl);background:var(--well);font-family:var(--mono);font-size:13px;color:var(--ink);min-width:0}
.ca-copyf span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}

/* divisores e listas de pares */
.ca-hr{height:1px;border:0;margin:0;background:var(--rule)}
.ca-or{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.ca-or::before,.ca-or::after{content:"";flex:1 1 0;height:1px;background:var(--rule)}
.ca-kvl{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);column-gap:20px}
.ca-kvl dt,.ca-kvl dd{padding:10px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.45}
.ca-kvl dt{color:var(--ink-3)}
.ca-kvl dd{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.ca-kvl dd.ca-mono{font-size:12.5px}

/* tabela */
.ca-tablewrap{overflow-x:auto;overscroll-behavior-x:contain;border-radius:var(--r-panel);box-shadow:inset 0 0 0 1px var(--rule);background:var(--sheet)}
.ca-table{font-size:14px;min-width:560px}
.ca-table th{padding:10px 14px;text-align:left;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);border-bottom:1px solid var(--rule);white-space:nowrap}
.ca-table td{padding:12px 14px;border-top:1px solid var(--rule);vertical-align:middle}
.ca-table tr:first-child td{border-top:0}
.ca-table .ca-num,.ca-table .r{text-align:right}
.ca-table td.ca-mono{white-space:nowrap}
.ca-nowrap{white-space:nowrap}
.ca-table tbody tr{transition:background-color var(--t-micro) var(--ease)}
.ca-table tbody tr:hover{background:var(--tint)}

/* cartão: só onde há algo para operar */
.ca-card{border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule)}
.ca-pad{padding:18px}
@media (min-width:640px){.ca-pad{padding:22px}}

/* reveal na entrada de página: começa visível em repouso */
.ca-in{animation:ca-rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 60ms + 80ms)}

/* ---------- movimento · [11] ----------
   micro 160 ms · painel 320 ms · saída 200 ms · mola · stagger 60 ms
   só transform e opacity · troca de tema e de página em cross-fade */
@keyframes ca-on{from{opacity:0}to{opacity:1}}
@keyframes ca-caret-step{0%,96%{opacity:1}100%{opacity:0}}
@keyframes ca-blink2{0%,24.9%{opacity:1}25%,49.9%{opacity:0}50%,74.9%{opacity:1}75%,100%{opacity:0}}
@keyframes ca-cursor3{0%,16.6%{opacity:1}16.7%,33.2%{opacity:0}33.3%,49.9%{opacity:1}50%,66.6%{opacity:0}66.7%,83.2%{opacity:1}83.3%,99.9%{opacity:0}100%{opacity:1}}
@keyframes ca-blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes ca-mk-frame{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:none}}
@keyframes ca-mk-scan{0%{opacity:0;transform:scaleY(0)}35%{opacity:.4}100%{opacity:0;transform:scaleY(1)}}
@keyframes ca-mk-slide{0%{opacity:0;transform:translate(-10px,-8px)}1%{opacity:.4;transform:translate(-10px,-8px)}100%{opacity:1;transform:none}}
@keyframes ca-turn{from{transform:rotate(45deg) scale(.86)}to{transform:rotate(135deg) scale(.86)}}
@keyframes ca-panel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ca-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ca-drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes ca-on-fade{from{opacity:0}to{opacity:1}}
@keyframes ca-off-fade{from{opacity:1}to{opacity:0}}
@keyframes ca-uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes ca-scan{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes ca-zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes ca-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes ca-sheet-out{from{transform:none}to{transform:translateY(100%)}}
@keyframes ca-pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ca-pop-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.985)}}
@keyframes ca-menu-in{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ca-menu-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes ca-drawer-in{from{transform:translateX(100%)}to{transform:none}}
@keyframes ca-drawer-out{from{transform:none}to{transform:translateX(100%)}}
@keyframes ca-step-in-r{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes ca-step-in-l{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes ca-step-out-l{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-14px)}}
@keyframes ca-step-out-r{from{opacity:1;transform:none}to{opacity:0;transform:translateX(14px)}}
@keyframes ca-pg-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ca-pg-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-8px)}}
@keyframes ca-shimmer{to{transform:translateX(100%)}}
@keyframes ca-shake{0%,100%{transform:none}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes ca-float-up{0%{opacity:0;transform:translateY(4px)}18%{opacity:1;transform:none}75%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes ca-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ca-bar-load{0%{transform:scaleX(0)}60%{transform:scaleX(.72)}100%{transform:scaleX(.9)}}
@keyframes ca-pulse-sq{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ca-typing{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-2px)}}

/* páginas: entrada quando a View Transitions API não está disponível */
.pg{animation:ca-pg-in .42s var(--ease) backwards;animation-delay:.04s}
.pg.is-vt{animation:none}
.pg.is-leaving{animation:ca-pg-out .17s var(--ease-exit) forwards;pointer-events:none}

/* View Transitions: página desliza e some; tema troca em cross-fade */
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.2,0,0,1)}
html[data-vt="page"]::view-transition-old(root){animation:ca-pg-out .2s cubic-bezier(.4,0,1,1) both}
html[data-vt="page"]::view-transition-new(root){animation:ca-pg-in .42s cubic-bezier(.2,0,0,1) .06s backwards}
html[data-vt="page"]::view-transition-group(ca-nav),html[data-vt="page"]::view-transition-group(ca-bar){animation-duration:.24s}
html[data-vt="fade"]::view-transition-old(root),html[data-vt="fade"]::view-transition-new(root){animation-duration:.15s}

/* barra de carregamento de página (abaixo da navegação) */
.ca-load{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:80;height:2px;pointer-events:none;opacity:0;transition:opacity .3s var(--ease)}
.ca-load i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.ca-load.is-run{opacity:1}
.ca-load.is-run i{animation:ca-bar-load .9s var(--ease) forwards}
.ca-load.is-end{opacity:0}
.ca-load.is-end i{transform:scaleX(1);transition:transform .2s var(--ease)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .ca-state.is-busy i,.ca-sq.is-busy{animation:none!important}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.15s!important}
}

/* ---------- camadas: folha, gaveta, menu, aviso ---------- */
.ca-ov{position:fixed;inset:0;z-index:60;font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.5}
.ca-ov__scrim{position:absolute;inset:0;background:var(--scrim);animation:ca-on-fade var(--t-panel) var(--ease) backwards}
.ca-ov[data-state="closing"] .ca-ov__scrim{animation:ca-off-fade var(--t-exit) var(--ease-exit) both}

/* folha: sobe da base no telefone, diálogo centrado no desktop */
.ca-ov--sheet{display:grid;place-items:end center}
.ca-sheet{position:relative;width:100%;max-width:560px;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow:hidden;background:var(--sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;animation:ca-sheet var(--t-panel) var(--ease) backwards}
.ca-ov[data-state="closing"] .ca-sheet{animation:ca-sheet-out var(--t-exit) var(--ease-exit) both}
.ca-sheet__scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.ca-sheet__grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--rule-2);margin:0 auto 16px}
.ca-sheet__x{position:absolute;top:10px;right:10px;z-index:2}
.ca-sheet__head{display:grid;gap:8px;padding-right:36px}
.ca-sheet__t{font-size:24px;line-height:1.15;font-weight:500;letter-spacing:-.025em;text-wrap:balance}
.ca-sheet__d{font-size:14.5px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.ca-sheet__body{margin-top:18px;display:grid;gap:16px}
.ca-sheet__foot{display:flex;flex-direction:column-reverse;gap:6px;margin-top:20px}
.ca-sheet__foot .ca-btn--primary,.ca-sheet__foot .ca-btn--danger{width:100%}
.ca-sheet__legal{margin-top:12px;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink-3)}
@media (min-width:640px){
  .ca-ov--sheet{place-items:center;padding:24px}
  .ca-sheet{max-height:calc(100dvh - 48px);border-radius:var(--r-panel);box-shadow:0 0 0 1px var(--rule);animation:ca-pop var(--t-panel) var(--ease) backwards}
  .ca-ov[data-state="closing"] .ca-sheet{animation:ca-pop-out var(--t-exit) var(--ease-exit) both}
  .ca-sheet__scroll{padding:26px}
  .ca-sheet__grab{display:none}
  .ca-sheet__foot{flex-direction:row;justify-content:flex-end;gap:8px}
  .ca-sheet__foot .ca-btn--primary,.ca-sheet__foot .ca-btn--danger{width:auto}
  .ca-sheet--sm{max-width:440px}
  .ca-sheet--lg{max-width:720px}
}
/* passos dentro da folha: deslizam para os lados */
.ca-stepper{position:relative}
.ca-stepper>.is-fwd{animation:ca-step-in-r var(--t-panel) var(--ease) backwards}
.ca-stepper>.is-back{animation:ca-step-in-l var(--t-panel) var(--ease) backwards}

/* gaveta lateral */
.ca-ov--drawer{display:flex;justify-content:flex-end}
.ca-drawer{position:relative;width:min(100%,460px);height:100%;display:flex;flex-direction:column;background:var(--sheet);box-shadow:-1px 0 0 var(--rule);animation:ca-drawer-in var(--t-panel) var(--ease) backwards;padding-top:env(safe-area-inset-top,0px)}
.ca-ov[data-state="closing"] .ca-drawer{animation:ca-drawer-out var(--t-exit) var(--ease-exit) both}
.ca-drawer--wide{width:min(100%,560px)}
.ca-drawer__head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:0 10px 0 20px;border-bottom:1px solid var(--rule)}
.ca-drawer__t{font-size:16px;font-weight:500;letter-spacing:-.015em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca-drawer__body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.ca-drawer__foot{flex:none;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);background:var(--sheet)}

/* menu ancorado (desktop); no telefone vira folha */
.ca-ov--pop{background:transparent}
.ca-pop{position:fixed;z-index:61;width:var(--pw,320px);max-width:calc(100vw - 16px);max-height:calc(100dvh - var(--pt,72px) - 12px);overflow:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:var(--r-panel);box-shadow:0 0 0 1px var(--rule-2);transform-origin:var(--po,top right);animation:ca-menu-in var(--t-micro) var(--ease) backwards}
.ca-ov[data-state="closing"] .ca-pop{animation:ca-menu-out 140ms var(--ease-exit) both}
@media (max-width:639px){
