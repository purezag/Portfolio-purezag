const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function trapTab(e, node) {
  if (e.key !== 'Tab' || !node) return;
  const items = Array.from(node.querySelectorAll(FOCUSABLE)).filter(x => x.offsetWidth || x.offsetHeight || x === document.activeElement);
  if (!items.length) { e.preventDefault(); return; }
  const a = items[0], z = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === a || !node.contains(document.activeElement))) { e.preventDefault(); z.focus(); }
  else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
}
function useLayer(open, onClose, ref, opts) {
  opts = opts || {};
  const closeRef = useRef(onClose); closeRef.current = onClose;
  useEffect(() => {
    if (!open) return;
    const entry = { esc: () => { if (opts.dismiss !== false && closeRef.current) closeRef.current(); } };
    OV_STACK.push(entry);
    const lock = opts.lock !== false;
    if (lock) lockScroll();
    const prev = document.activeElement;
    const t = setTimeout(() => {
      const n = ref.current; if (!n) return;
      const f = n.querySelector('[data-autofocus]') || (opts.focusFirst === false ? null : n.querySelector(FOCUSABLE));
      try { (f || n).focus({ preventScroll: true }); } catch (e) {}
    }, 40);
    return () => {
      clearTimeout(t);
      const i = OV_STACK.indexOf(entry); if (i >= 0) OV_STACK.splice(i, 1);
      if (lock) unlockScroll();
      try { if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true }); } catch (e) {}
    };
  }, [open]);
}

/* menu ancorado num botão; no telefone vira folha */
function Pop({ open, onClose, anchor, width, label, children, origin }) {
  const { mounted, state } = usePresence(open, 150);
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const wide = isWide();
  useLayer(open, onClose, ref, { lock: !wide, focusFirst: true });
  useLayoutEffect(() => {
    if (!open || !anchor) return;
    const place = () => {
      const r = anchor.getBoundingClientRect();
      setPos({ top: Math.round(r.bottom + 8), right: Math.max(8, Math.round(window.innerWidth - r.right)) });
    };
    place();
    window.addEventListener('resize', place);
    return () => window.removeEventListener('resize', place);
  }, [open, anchor]);
  useEffect(() => {
    if (!open) return;
    const down = e => {
      const n = ref.current;
      if (!n || n.contains(e.target) || (anchor && anchor.contains(e.target))) return;
      if (onClose) onClose();
    };
    const t = setTimeout(() => document.addEventListener('mousedown', down), 0);
    const onScroll = () => { if (isWide() && onClose) onClose(); };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { clearTimeout(t); document.removeEventListener('mousedown', down); window.removeEventListener('scroll', onScroll); };
  }, [open, anchor]);
  if (!mounted) return null;
  const st = pos ? { top: pos.top + 'px', right: pos.right + 'px', '--pw': (width || 320) + 'px', '--pt': pos.top + 'px', '--po': origin || 'top right' } : { top: '72px', right: '12px', '--pw': (width || 320) + 'px' };
  return html`<${Portal}>
    <div class="ca-ov ca-ov--pop" data-state=${state}>
      <div class="ca-ov__scrim" onClick=${onClose}></div>
      <div class=${cx('ca-pop', !wide && 'is-sheet')} role="dialog" aria-label=${label} ref=${ref} style=${st} tabindex="-1" onKeyDown=${e => trapTab(e, ref.current)}>${children}</div>
    </div>
  <//>`;
}

const balanceOf = s => (s ? (s.credits.monthly || 0) + (s.credits.extra || 0) : 0);
function debit(n, label) {
  const s = store.get(); if (!s.session) return false;
  const c = s.session.credits, bal = balanceOf(s.session);
  if (bal < n) return false;
  const fromM = Math.min(c.monthly, n), fromX = n - fromM;
  const nc = Object.assign({}, c, { monthly: c.monthly - fromM, extra: c.extra - fromX });
  const entry = { id: uid(), at: new Date().toISOString(), label, amount: -n, bal: bal - n, kind: 'uso' };
  store.set(st => ({ session: Object.assign({}, st.session, { credits: nc }), ledger: [entry].concat(st.ledger), ui: Object.assign({}, st.ui, { lastDebit: { n: -n, id: uid() } }) }));
  return true;
}
function addCredits(n, label, kind, extra) {
  const s = store.get(); if (!s.session) return;
  const c = s.session.credits;
  const nc = extra ? Object.assign({}, c, { extra: (c.extra || 0) + n }) : Object.assign({}, c, { monthly: n, cap: n });
  const bal = (nc.monthly || 0) + (nc.extra || 0);
  const entry = { id: uid(), at: new Date().toISOString(), label, amount: extra ? n : n, bal, kind: kind || 'compra' };
  store.set(st => ({ session: Object.assign({}, st.session, { credits: nc }), ledger: [entry].concat(st.ledger), ui: Object.assign({}, st.ui, { lastDebit: { n: extra ? n : bal - balanceOf(s.session), id: uid() } }) }));
}

  store.set(s => ({ declarations: [d].concat(s.declarations) }));
  return d;
}
/* registro do arquivo exportado: impressão digital e identificador de procedência (simulados no protótipo) */
async function exportRecord(name, seed) {
  const fp = await fingerprintText('resultado:' + seed + ':' + name);
  const r = rng(seedOf('c2pa:' + seed + ':' + name + ':' + Date.now()));
  const hx = n => { let o = ''; for (let i = 0; i < n; i++) o += Math.floor(r() * 16).toString(16); return o; };
  return { file: { name, hash: fp.hex, algo: 'SHA-256 do arquivo exportado · simulado' }, c2pa: 'urn:uuid:' + hx(8) + '-' + hx(4) + '-4' + hx(3) + '-a' + hx(3) + '-' + hx(12) };
}
function patchDecl(id, patch) { store.set(s => ({ declarations: s.declarations.map(d => (d.id === id ? Object.assign({}, d, patch) : d)) })); }
function notify(title, body, route) {
  const n = { id: uid(), at: new Date().toISOString(), title, body, route, read: false };
  store.set(s => ({ notifications: [n].concat(s.notifications).slice(0, 30) }));
}
function deviceName() {
  try {
    const u = navigator.userAgent || '';
    const b = /Edg\//.test(u) ? 'Edge' : /Firefox\//.test(u) ? 'Firefox' : /Chrome\//.test(u) ? 'Chrome' : /Safari\//.test(u) ? 'Safari' : 'Navegador';
    const o = /iPhone|iPad/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android' : /Mac OS X/.test(u) ? 'macOS' : /Windows/.test(u) ? 'Windows' : /Linux/.test(u) ? 'Linux' : '';
    return b + (o ? ' no ' + o : '');
  } catch (e) { return 'Navegador'; }
}

const HERO_STATE = { ready: false, waiters: [] };
function heroReady() { return HERO_STATE.ready ? Promise.resolve() : new Promise(r => HERO_STATE.waiters.push(r)); }
function markHeroReady() { if (HERO_STATE.ready) return; HERO_STATE.ready = true; HERO_STATE.waiters.splice(0).forEach(f => f()); }

function ThemeBtn() {

    <span><span class=${dark ? '' : 'is-cur'}>Claro</span> / <span class=${dark ? 'is-cur' : ''}>Escuro</span></span>
  </button>`;
}

function HeroVideo() {
  const vref = useRef(null), prog = useRef(null), tcRef = useRef(null);
  const [on, setOn] = useState(false);
  const [paused, setPaused] = useState(isReduced());
  const [chap, setChap] = useState(0);
  const pausedRef = useRef(paused); pausedRef.current = paused;
  useEffect(() => {
    const v = vref.current; if (!v) return;
    let alive = true, blob = null, triedBlob = false, raf = 0;
    v.muted = true; v.defaultMuted = true; v.playsInline = true;
    const tryPlay = () => { if (pausedRef.current) return; try { const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
    const viaBlob = async () => {
      if (triedBlob) { markHeroReady(); return; }
      triedBlob = true;
      try {
        const r = await fetch(HERO.src); if (!r.ok) throw new Error('http');
        const b = await r.blob(); if (!alive) return;
        blob = URL.createObjectURL(b); v.src = blob; v.load(); tryPlay();
      } catch (e) { markHeroReady(); }
    };
    const onData = () => { markHeroReady(); };
    const onPlaying = () => { if (alive) setOn(true); };
    const onErr = () => { viaBlob(); };
    v.addEventListener('loadeddata', onData);
    v.addEventListener('playing', onPlaying);
    v.addEventListener('error', onErr);
    v.src = HERO.src;
    try { v.load(); } catch (e) {}
    tryPlay();
    const t1 = setTimeout(() => { if (v.readyState < 2) viaBlob(); }, 4500);
    const t2 = setTimeout(markHeroReady, 6000);
    const D = HERO.duration || 12;
    let lastChap = -1;
    const loop = () => {
      const t = v.currentTime || 0, d = v.duration && isFinite(v.duration) ? v.duration : D;
      if (prog.current) prog.current.style.setProperty('--p', String(clamp(t / d, 0, 1)));
      if (tcRef.current) tcRef.current.textContent = fmtT(t) + ' / ' + fmtT(d);
      let ci = 0; HERO.chapters.forEach((c, i) => { if (t >= c.t) ci = i; });
      if (ci !== lastChap) { lastChap = ci; setChap(ci); }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => {
      alive = false; cancelAnimationFrame(raf); clearTimeout(t1); clearTimeout(t2);
      v.removeEventListener('loadeddata', onData); v.removeEventListener('playing', onPlaying); v.removeEventListener('error', onErr);
      try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
      if (blob) { try { URL.revokeObjectURL(blob); } catch (e) {} }
    };
  }, []);
  const toggle = () => {
    const v = vref.current; if (!v) return;
    if (paused) { setPaused(false); pausedRef.current = false; try { const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    else { setPaused(true); try { v.pause(); } catch (e) {} }
  };
  const text = HERO.chapters[chap] ? HERO.chapters[chap].text : '';
  return html`<section class="ca-auth__media" aria-label="Vídeo de demonstração do Beatframe">
    <div class=${cx('ca-auth__poster', on && 'is-hidden')} style=${{ backgroundImage: 'url(' + HERO.poster + ')' }} aria-hidden="true"></div>
    <video ref=${vref} class=${on ? 'is-on' : ''} muted playsinline loop preload="auto" aria-hidden="true" tabindex="-1" disablepictureinpicture></video>
    <div class="ca-auth__scrim" aria-hidden="true"></div>
    <div class="ca-auth__top">
      <span class="ca-auth__brand"><${Lockup} fs=${20} /></span>
      <div class="ca-auth__ctl">
        <span class="ca-auth__tc" ref=${tcRef} aria-hidden="true">00:00 / 00:12</span>
        <button type="button" class="ca-vbtn" onClick=${toggle} aria-pressed=${paused ? 'true' : 'false'} aria-label=${paused ? 'Reproduzir o vídeo' : 'Pausar o vídeo'}>
          <${Icon} n=${paused ? 'play' : 'pause'} />${paused ? 'reproduzir' : 'pausar'}
        </button>
      </div>
    </div>
    <div class="ca-auth__copy">
      <p class="ca-auth__h">O ritmo de uma edição que funciona, com o seu material.</p>
      <p class="ca-auth__term" aria-hidden="true"><span class="ca-cmd__p">~/beatframe $ </span><span class="ca-auth__line" key=${chap}>${text}</span><span class="ca-caret"></span></p>
    </div>
    <div class="ca-auth__prog" aria-hidden="true"><i ref=${prog}></i></div>
  </section>`;
}

function nameFromEmail(email) {
  const local = String(email || '').split('@')[0].replace(/[._-]+/g, ' ').replace(/\d+/g, '').trim();
  return local ? local.split(' ').map(cap1).join(' ') : 'Sua conta';
}
function signIn(seed, opts) {
  opts = opts || {};
  const s0 = store.get();
  store.set(Object.assign({ projects: [], declarations: [], ledger: [], invoices: [], notifications: [], tickets: [], sessions: [] }, seed));
  if (opts.declare) recordDecl(opts.declare);

function demoLogin(email, provider) {
  const seed = demoSeed();
  if (email && email.toLowerCase() !== DEMO_USER.email) {

    seed.session.user.name = nameFromEmail(email);

  setTimeout(() => toast(msg || 'Você saiu da sua conta.'), 500);

function OTP({ value, onChange, onDone, error, id }) {
  const refs = useRef([]);
  const digits = (value + '      ').slice(0, 6).split('');
  const setAt = (i, ch) => {
    const arr = (value + '      ').slice(0, 6).split('');
    arr[i] = ch; const v = arr.join('').replace(/\s/g, '');
    onChange(v);
    if (v.length === 6 && onDone) onDone(v);
  };
  const onIn = (i, e) => {
    const raw = String(e.target.value || '').replace(/\D/g, '');
    if (raw.length > 1) { const v = (value.slice(0, i) + raw).slice(0, 6); onChange(v); const nx = Math.min(5, v.length); if (refs.current[nx]) refs.current[nx].focus(); if (v.length === 6 && onDone) onDone(v); return; }
    if (!raw) return;
    setAt(i, raw);
    if (i < 5 && refs.current[i + 1]) refs.current[i + 1].focus();
  };
  const onKey = (i, e) => {
    if (e.key === 'Backspace') {
      e.preventDefault();
      const arr = (value + '      ').slice(0, 6).split('');
      if (arr[i] && arr[i] !== ' ') { arr[i] = ' '; onChange(arr.join('').trimEnd().replace(/\s/g, '')); }
      else if (i > 0) { arr[i - 1] = ' '; onChange(arr.join('').replace(/\s/g, '')); refs.current[i - 1].focus(); }
    } else if (e.key === 'ArrowLeft' && i > 0) refs.current[i - 1].focus();
    else if (e.key === 'ArrowRight' && i < 5) refs.current[i + 1].focus();
  };
  const onPaste = e => {
    const t = (e.clipboardData && e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    if (!t) return; e.preventDefault(); onChange(t);
    const nx = Math.min(5, t.length); if (refs.current[nx]) refs.current[nx].focus();
    if (t.length === 6 && onDone) onDone(t);
  };
  return html`<div class=${cx('ca-otp', error && 'is-error')} role="group" aria-label="Código de 6 dígitos" id=${id}>
    ${digits.map((d, i) => html`<input key=${i} ref=${el => { refs.current[i] = el; }} inputmode="numeric" autocomplete=${i === 0 ? 'one-time-code' : 'off'} maxlength="6"
      value=${d.trim()} class=${d.trim() ? 'is-filled' : ''} aria-label=${'Dígito ' + (i + 1)} data-autofocus=${i === 0 ? '' : undefined}
      onInput=${e => onIn(i, e)} onKeyDown=${e => onKey(i, e)} onPaste=${onPaste} onFocus=${e => e.target.select()} />`)}
  </div>`;
}

/* compromisso de uso responsável (primeiro acesso) */
function Onboarding({ open, onClose, isNew }) {
  const session = useStore(s => s.session);
  const [step, setStep] = useState(isNew ? 0 : 1);
  const [role, setRole] = useState('');
  const [ok, setOk] = useState(false);
  const [age, setAge] = useState(false);
  const [tried, setTried] = useState(false);
  if (!session) return null;
  const legal = slug => e => { e.preventDefault(); openOverlay('legal', { slug, back: { type: 'onboarding', props: { isNew } } }); };
  const accept = () => {
    if (!ok || !age) { setTried(true); return; }
    const d = recordDecl({ kind: 'compromisso', items: ['compromisso', 'termos', 'uso-aceitavel', 'privacidade-lida', 'idade'] });
    store.set(s => ({ flags: Object.assign({}, s.flags, { commit: Object.assign({}, (s.flags || {}).commit || {}, { [session.user.email]: d.at }) }) }));
    if (role) setSession(se => ({ user: Object.assign({}, se.user, { role }), onboarded: true })); else setSession({ onboarded: true });
    closeOverlay();
    setTimeout(() => toast(isNew ? 'Tudo certo. Comece com o exemplo ou envie a sua referência.' : 'Compromisso registrado · ' + d.id + '.'), 260);
  };
  return html`<${Sheet} open=${open} onClose=${onClose} dismiss=${false} labelledBy="ob-t" size="sm">
    <div class="ca-stepper">
      ${step === 0 ? html`<div key="s0" class="is-fwd">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><p class="ca-kicker">conta criada</p><span class="ca-stepdots" aria-hidden="true"><i class="is-on"></i><i></i></span></div>
        <h2 class="ca-sheet__t" id="ob-t">Como você vai usar o Beatframe?</h2>
        <p class="ca-sheet__d" style="margin-top:8px">Isso ajusta os exemplos e as dicas. Dá para mudar depois no perfil.</p>
        <div class="ca-roles" style="margin-top:18px">${ROLES.map(r => html`<button type="button" class="ca-role" aria-pressed=${role === r.id ? 'true' : 'false'} onClick=${() => setRole(r.id)}><i class="ca-sq" aria-hidden="true"></i><b>${r.label}</b><span>${r.d}</span></button>`)}</div>
        <div class="ca-sheet__foot"><${Btn} kind="ghost" onClick=${() => setStep(1)}>Pular<//><${Btn} kind="primary" onClick=${() => setStep(1)}>Continuar<//></div>
      </div>` : html`<div key="s1" class="is-fwd">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><p class="ca-kicker">antes de começar</p>${isNew && html`<span class="ca-stepdots" aria-hidden="true"><i class="is-on"></i><i class="is-on"></i></span>`}</div>
        <h2 class="ca-sheet__t" id="ob-t">Compromisso de uso responsável</h2>
        <p class="ca-sheet__d" style="margin-top:8px">O Beatframe monta edições no ritmo de uma referência, com o seu material. Para usar, você se compromete a:</p>
        <ol class="ca-commit" style="margin-top:16px">
          <li><span>[01]</span>Enviar só material próprio ou licenciado: vídeos, imagens, textos, marcas e músicas.</li>
          <li><span>[02]</span>Ter autorização das pessoas que aparecem nos seus arquivos.</li>
          <li><span>[03]</span>Usar referências obtidas de forma lícita, só como modelo de estrutura, e não publicar resultados que violem direitos de terceiros.</li>
          <li><span>[04]</span>Confirmar os direitos antes de enviar, gerar e baixar. Cada confirmação fica registrada.</li>
        </ol>
        <div style="margin-top:14px;display:grid;gap:10px">
          <${Check} bare on=${ok} invalid=${tried && !ok} onChange=${v => { setOk(v); setTried(false); }}
            label=${html`Li e aceito este compromisso, os <a class="ca-inl" href="#termos" onClick=${legal('termos')}>Termos de Uso</a> e a <a class="ca-inl" href="#uso-aceitavel" onClick=${legal('uso-aceitavel')}>Política de Uso Aceitável</a>. Li a <a class="ca-inl" href="#privacidade" onClick=${legal('privacidade')}>Política de Privacidade</a>.`} />
          <${Check} bare on=${age} invalid=${tried && !age} onChange=${v => { setAge(v); setTried(false); }} label="Tenho 18 anos ou mais." />
        </div>
        ${tried && (!ok || !age) && html`<p class="ca-err" role="alert">Marque as duas caixas para continuar.</p>`}
        <p class="ca-sheet__legal">registro: data, hora, IP, dispositivo e versão dos termos (v${EMPRESA.versao})</p>
        <div class="ca-sheet__foot"><${Btn} kind="ghost" onClick=${() => { closeOverlay(); setTimeout(() => signOut('Você saiu. O compromisso é necessário para usar o Beatframe.'), 240); }}>Sair<//><${Btn} kind="primary" onClick=${accept} disabled=${!ok || !age}>Aceitar e continuar<//></div>
      </div>`}
    </div>
  <//>`;
}

let AUTH_HINT = '';
function jobProgress(job) { if (!job) return 0; return clamp((Date.now() - job.start) / job.total, 0, 1); }

function CreditsBtn() {
  const session = useStore(s => s.session);
  const last = useStore(s => s.ui.lastDebit);
  const jobs = useStore(s => s.jobs);
  const [, tick] = useReducer(x => x + 1, 0);
  const active = Object.values(jobs || {}).filter(Boolean);
  useInterval(tick, 300, active.length > 0);
  const bal = balanceOf(session);
  const shown = useCount(bal, 700);
  if (!session) return null;
  const low = bal < 40;
  const job = active[0];
  return html`<button type="button" class=${cx('ca-cred', low && 'is-low')} onClick=${e => openOverlay('cred', { anchor: e.currentTarget })} aria-label=${fmtInt(bal) + ' créditos. Ver créditos e comprar mais'}>

}

function ratioOf(w, h) {
  if (!w || !h) return '9:16';
  const r = w / h; let best = '9:16', d = 1e9;
  [['9:16', 9 / 16], ['2:3', 2 / 3], ['3:4', 3 / 4], ['4:5', 4 / 5], ['1:1', 1], ['5:4', 5 / 4], ['4:3', 4 / 3], ['3:2', 3 / 2], ['16:9', 16 / 9], ['21:9', 21 / 9]].forEach(x => { const dd = Math.abs(Math.log(r / x[1])); if (dd < d) { d = dd; best = x[0]; } });
  return best;
}
function kindOf(file) {
  const t = String(file.type || '').toLowerCase(), n = String(file.name || '').toLowerCase();
  if (t.indexOf('image/') === 0 || /\.(jpe?g|png|webp|gif|avif|heic)$/.test(n)) return 'image';
  if (t.indexOf('video/') === 0 || /\.(mp4|mov|webm|m4v|mkv)$/.test(n)) return 'video';
  if (t.indexOf('audio/') === 0 || /\.(mp3|wav|m4a|aac|ogg|flac)$/.test(n)) return 'audio';
  if (t.indexOf('text/') === 0 || /\.(txt|md|srt|vtt|rtf)$/.test(n)) return 'text';
  if (/\.(pdf|docx?|odt|pages|pptx?|key|xlsx?|csv)$/.test(n)) return 'doc';
  return 'other';
}

const extOf = name => { const m = /\.([a-z0-9]{1,5})$/i.exec(name || ''); return m ? m[1].toLowerCase() : 'arq'; };

function sampleVideo() {
  const D = 18, bpm = 124, beat = 60 / bpm;
  const pat = [3, 2, 1, 1, 2, 1, 1, 2, 2, 1, 1, 1, 2, 1, 1, 2, 2, 1, 1, 2, 1, 2, 1], cuts = []; let t = 0;
  pat.forEach(b => { cuts.push({ s: t, e: t + b * beat }); t += b * beat; });

  cuts.forEach((c, i) => { const a = REF_ARTS[i % REF_ARTS.length]; c.art = 'ca-art--' + a; c.label = i === 0 ? 'Gancho: ' + ART_LABEL[a].toLowerCase() : (i === cuts.length - 1 ? 'Chamada final' : ART_LABEL[a]); });
  const caps = [], blocks = [];

      return { s: cs, e: cs + dur, text: txt };

    : reading ? 'Lendo a referência…'
    : !nF ? 'Falta enviar seus arquivos.'
    : !musicReady ? 'Falta enviar a trilha.'
    : hasPrompt ? 'Tudo pronto.' : 'Tudo pronto. Instruções são opcionais.';
  v.costText = ph === 'edit' && ready ? 'custo ' + plural(v.cost, 'crédito', 'créditos') : '';
  v.textFile = textFile;
  return v;
};

Workspace.prototype.render = function () {

  return html`<${Fragment}>

      </div>
    </div>
    ${v.isFlow && html`<div class=${cx('ca-bar', v.barCls)} role="region" aria-label="Gerar versão">
      <span class="ca-bar__prog" style=${{ '--p': v.barP }} aria-hidden="true"></span>
      <div class="ca-wrap ca-bar__in">
        <div class="ca-ready">

          <span class="ca-ready__bars" aria-hidden="true">${v.readyBars.map(b => html`<span class=${cx('ca-ready__bar', b.on && 'is-on')} title=${b.label}></span>`)}</span>

/* folha: antes de gerar */
Workspace.prototype.renderRights = function (v) {
  const s = this.state, mode = v.mode, f = v.f, r = v.r, self = this;
  const open = s.modal === 'rights' && v.isFlow && !!r;
  let rows = [], cost = 0, bal = 0, short = false, resList = [], cur = '';
  if (r) {
    const nF = f.files.length, totalBytes = f.files.reduce((a, x) => a + (x.size || 0), 0);
    const sample = !!r.sample;
    const labels = {
      referencia: [DECL_TEXT.referencia, r.name + (sample ? ' · exemplo do Beatframe' : '')],
      'referencia-img': [DECL_TEXT['referencia-img'], r.name + (sample ? ' · exemplo do Beatframe' : '')],
      arquivos: ['Sou titular ou tenho licença ' + (nF === 1 ? 'do arquivo base' : 'dos ' + nF + ' arquivos base') + ' (imagens, vídeos, textos e marcas).', plural(nF, 'arquivo', 'arquivos') + ' · ' + fmtBytes(totalBytes)],
      imagem: [DECL_TEXT.imagem, 'direito de imagem e voz'],
      'trilha-propria': [DECL_TEXT['trilha-propria'], f.music ? f.music.name : ''],
      'trilha-auto': [DECL_TEXT['trilha-auto'], v.an ? v.an.genre + ' · ' + v.an.bpm + ' bpm · biblioteca licenciada' : 'biblioteca licenciada'],
      responsabilidade: [DECL_TEXT.responsabilidade, 'termos de uso v' + EMPRESA.versao]
    };
    rows = this.checkKeys(mode, f).map(k => ({ k, label: labels[k][0], sub: labels[k][1], on: !!s.checks[k] }));
    cost = this.costOf(mode, f); bal = v.balance; short = bal < cost;
    resList = this.resList(); cur = this.curRes();
  }
  const allOn = rows.length && rows.every(x => x.on);
  const nOn = rows.filter(x => x.on).length;
  return html`<${Sheet} open=${open} onClose=${this.h.closeModal} labelledBy="rt-t" dismiss=${!s.busy}>
    <${SheetHead} id="rt-t" kicker="antes de gerar" title="Confirme os direitos antes de gerar." desc="Leia e marque cada item. A confirmação é feita um por um." />
    <div class="ca-sheet__body">
      <dl class="ca-sumrow">
        <div><dt>${mode === 'video' ? 'duração' : 'formato'}</dt><dd>${mode === 'video' && v.an ? fmtT(v.an.D) : (v.ai ? v.ai.ratio : '')}</dd></div>
        <div><dt>custo</dt><dd>${plural(cost, 'crédito', 'créditos')}</dd></div>
        <div><dt>saldo depois</dt><dd class=${short ? 'is-warn' : ''}>${short ? 'faltam ' + fmtInt(cost - bal) : fmtInt(bal - cost)}</dd></div>
      </dl>
      ${mode === 'video' && html`<div class="ca-qual"><span class="ca-qual__l">Qualidade da exportação</span><${Segm} size="sm" label="Qualidade" value=${cur} onChange=${val => self.setState({ res: val })} options=${RES_ORDER.map(x => ({ v: x, l: x, disabled: !resList.includes(x), title: !resList.includes(x) ? 'Disponível em planos maiores' : RATES[x] + ' crédito(s) por segundo' }))} /></div>`}
      ${short ? html`<div class="ca-note ca-note--warn"><span>Seu saldo é de <b>${fmtInt(bal)}</b> créditos e esta versão custa <b>${fmtInt(cost)}</b>. Compre créditos ou mude de plano para continuar.</span></div>` : null}
      <div>
        <div class="ca-checks">${rows.map(x => html`<${Check} key=${x.k} on=${x.on} onChange=${() => self.toggleCheck(x.k)} label=${x.label} sub=${x.sub} />`)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px"><span class="ca-checkcount" aria-live="polite">${nOn} de ${rows.length} confirmados</span><a class="ca-link ca-link--sm" href="#termos" onClick=${e => { e.preventDefault(); openOverlay('legal', { slug: 'termos' }); }}>Ler os Termos</a></div>
      </div>
    </div>
    <p class="ca-sheet__legal">registro: data, hora, IP, dispositivo, versão dos termos e impressão digital SHA-256 de cada arquivo. O comprovante fica em Dados e privacidade.</p>
    <div class="ca-sheet__foot">
      <${Btn} kind="ghost" onClick=${this.h.closeModal} disabled=${!!s.busy}>Cancelar<//>
      ${short ? html`<${Fragment}><${Btn} kind="line" onClick=${() => { self.setState({ modal: null }); navigate('planos'); }}>Mudar plano<//><${Btn} kind="primary" onClick=${() => { self.setState({ modal: null }); setTimeout(() => openOverlay('checkout', { kind: 'pack', id: cost - bal > 300 ? 'p1000' : 'p300' }), 230); }}>Comprar créditos<//><//>`
        : html`<${Btn} kind="primary" onClick=${this.h.confirmGen} disabled=${!allOn} busy=${s.busy === 'gen'}>Assinar e gerar<//>`}
    </div>
  <//>`;
};

/* folha: antes de enviar */
const REF_SUB = {
  'ref-estrutura': 'Cortes, ritmo, tempo das legendas e efeitos. O resultado não pode reproduzir imagens, sons, textos, personagens ou marcas da referência.',
  'ref-titular': 'Você criou a referência ou é dono dela.',
  'ref-licenca': 'Você tem contrato, licença ou permissão por escrito para usá-la.'
};
const FILE_SUB = { titular: 'Você criou ou é dono do material.', licenca: 'Você tem contrato, licença ou permissão por escrito.', lei: 'Domínio público ou outra hipótese prevista em lei.' };
Workspace.prototype.renderUpload = function () {
  const s = this.state, p = s.pending, self = this;
  const open = s.modal === 'upload' && !!p;
  const files = p ? p.files : [];
  const isRef = !!(p && p.zone === 'ref');
  const what = p ? (isRef ? (p.mode === 'video' ? 'o vídeo de referência' : 'a imagem de referência') : p.zone === 'music' ? 'a trilha' : (files.length === 1 ? 'este arquivo' : 'estes ' + files.length + ' arquivos')) : '';
  const total = files.reduce((a, f) => a + (f.size || 0), 0);
  const bases = isRef ? BASIS_REF : BASIS, subs = isRef ? REF_SUB : FILE_SUB;
  const sc = s.scan;
  const nBad = sc ? sc.items.filter(x => x.st === 'blocked').length : 0, nOk = sc ? sc.items.filter(x => x.st === 'ok').length : 0;
  const close = () => { if (!s.busy) self.setState({ modal: null, pending: null, scan: null }); };
  const title = !sc ? (isRef ? 'Confirme como você vai usar esta referência.' : 'Confirme os direitos sobre estes arquivos.')
    : !sc.done ? 'Verificando o conteúdo.' : nBad === 1 ? 'Um arquivo foi recusado.' : nBad + ' arquivos foram recusados.';
  return html`<${Sheet} open=${open} onClose=${close} labelledBy="up-t" dismiss=${!s.busy}>
    <${SheetHead} id="up-t" kicker=${sc ? 'verificação de conteúdo' : 'antes de enviar'} title=${title} desc=${sc ? (sc.done ? 'Nada foi enviado ainda. Arquivos recusados não são processados nem guardados.' : 'Cada arquivo é verificado antes de ser aceito.') : 'Você está enviando ' + what + ' · ' + fmtBytes(total) + '.'} />
    <div class="ca-sheet__body">
      ${sc ? html`<div class="ca-scan" role="status" aria-live="polite">
        <ul class="ca-scan__list">${sc.items.map((x, i) => html`<li key=${i} class=${'is-' + x.st}>
          <span class="ca-scan__n">${x.name}</span>
          <span class="ca-scan__s">${x.st === 'wait' ? html`<${Fragment}><i class="ca-sq is-busy" aria-hidden="true"></i>verificando<//>` : x.st === 'ok' ? '[ok] aprovado' : '[--] recusado'}</span>
          ${x.st === 'blocked' && html`<span class="ca-scan__r">O arquivo ${x.reason}.</span>`}
        </li>`)}</ul>
        <p class="ca-scan__d">${sc.done ? 'Se você acha que foi um engano, peça revisão humana. Uma pessoa da equipe responde em até 2 dias úteis.' : 'Procuramos nudez e conteúdo sexual, violência explícita, risco a crianças e adolescentes e material ilegal já conhecido.'}</p>
      </div>` : html`<${Fragment}>
      <ul class="ca-flist">${files.map((f, i) => html`<li key=${i}><span>${f.name}</span><small>${fmtBytes(f.size)}</small></li>`)}</ul>
      <div class="ca-fld"><p class="ca-fld__l"><span>${isRef ? 'Como você vai usar a referência' : 'Base dos seus direitos'}</span></p>
        <div class="ca-radios" role="radiogroup" aria-label=${isRef ? 'Como você vai usar a referência' : 'Base dos seus direitos'}>
          ${Object.keys(bases).map(k => html`<${Radio} key=${k} name="basis" value=${k} on=${s.basis === k} onChange=${val => self.setState({ basis: val })} label=${bases[k]} sub=${subs[k]} />`)}
        </div>
      </div>
      <div class="ca-checks"><${Check} on=${s.upOk} onChange=${val => self.setState({ upOk: val })} label=${isRef ? DECL_TEXT['envio-ref'] : DECL_TEXT.envio} sub=${isRef ? 'obtenção lícita e uso só da estrutura' : 'direito autoral, de imagem e de voz'} /></div>
      <//>`}
    </div>
    ${!sc && html`<p class="ca-sheet__legal">registro: data, hora, IP, dispositivo, ${isRef ? 'forma de uso declarada' : 'base declarada'} e impressão digital SHA-256 de cada arquivo. Depois, cada arquivo passa pela verificação de conteúdo.<br />demonstração: um arquivo com "+18" ou "bloqueio" no nome simula a recusa.</p>`}
    <div class="ca-sheet__foot">
      ${!sc ? html`<${Fragment}>
        <${Btn} kind="ghost" onClick=${close} disabled=${!!s.busy}>Cancelar<//>
        <${Btn} kind="primary" onClick=${() => self.confirmUpload()} disabled=${!s.basis || !s.upOk} busy=${s.busy === 'up'}>Confirmar e enviar<//>
      <//>` : !sc.done ? html`<${Btn} kind="primary" busy=${true} disabled=${true}>Verificando<//>`
        : html`<${Fragment}>
        <${Btn} kind="ghost" onClick=${close}>Fechar<//>
        <${Btn} kind="line" onClick=${() => self.askReview()}>Pedir revisão<//>
        ${nOk > 0 && html`<${Btn} kind="primary" onClick=${() => self.sendApproved()}>${'Enviar ' + (nOk === 1 ? 'o aprovado' : 'os ' + nOk + ' aprovados')}<//>`}
      <//>`}
    </div>
  <//>`;
};

/* folha: antes de baixar */
Workspace.prototype.renderDownload = function (v) {
  const s = this.state, self = this, f = v.f;
  const open = s.modal === 'download' && v.isFlow && v.ph === 'done';
  const isImg = v.isImage;
  const fname = baseName(f.ref && f.ref.name) + '-versao.' + (isImg ? 'png' : 'mp4');
  const job = f.projectId ? store.get().projects.find(p => p.id === f.projectId) : null;
  const res = job ? job.res : (isImg ? '1080×1350' : this.curRes());
  const est = isImg ? 2.4 * 1048576 : ((v.an ? v.an.D : 18) * (res === '4K' ? 4.2 : res === '1080p' ? 1.6 : 0.8) * 1048576);
  return html`<${Sheet} open=${open} onClose=${() => { if (!s.dl) self.setState({ modal: null }); }} labelledBy="dl-t" dismiss=${!s.dl} size="sm">
    <${SheetHead} id="dl-t" kicker="antes de baixar" title=${isImg ? 'Baixar a sua imagem' : 'Baixar o seu vídeo'} />
    <div class="ca-sheet__body">
      <dl class="ca-kvl">
        <dt>arquivo</dt><dd class="ca-mono">${fname}</dd>
        <dt>qualidade</dt><dd class="ca-mono">${res}${v.free ? ' · marca d’água' : ''}</dd>
        <dt>tamanho</dt><dd class="ca-mono">cerca de ${fmtBytes(est)}</dd>
        <dt>procedência</dt><dd>Metadados indicam edição assistida por IA (C2PA quando disponível).</dd>
        ${job && job.track && job.track.lib && html`<${Fragment}><dt>trilha</dt><dd>Biblioteca licenciada · certificado <span class="ca-mono ca-nowrap">${job.track.lic}</span></dd><//>`}
      </dl>
      ${(job ? job.sample : f.files.some(x => x.sample)) && html`<div class="ca-note"><span><b>Material de exemplo.</b> O arquivo é só para teste: não publique nem use comercialmente.</span></div>`}
      <div class="ca-checks"><${Check} on=${s.dlOk} onChange=${val => self.setState({ dlOk: val })} label=${DECL_TEXT.download} sub="instagram · tiktok · youtube têm regras próprias para música e marcas" /></div>
      ${s.dl && html`<div><div class="ca-dlprog" role="progressbar" aria-label="Preparando o arquivo" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${Math.round(s.dl.p * 100)}><i style=${{ '--p': s.dl.p }}></i></div><p class="ca-mono" style="margin-top:8px;color:var(--ink-3)">preparando ${fname} · ${pad3(Math.round(s.dl.p * 100))}%</p></div>`}
    </div>
    <div class="ca-sheet__foot">
      <${Btn} kind="ghost" onClick=${() => self.setState({ modal: null })} disabled=${!!s.dl}>Cancelar<//>
      <${Btn} kind="primary" onClick=${() => self.confirmDownload()} disabled=${!s.dlOk} busy=${!!s.dl}>${isImg ? 'Baixar PNG' : 'Baixar MP4'}<//>
    </div>
  <//>`;
};

  return html`<form class="ca-wait" onSubmit=${e => { e.preventDefault(); if (!emailOk(mail)) { toast('Digite um e-mail válido.', { kind: 'warn' }); return; } self.setWait({ done: true, mail }); toast('Inscrição na lista de espera registrada.'); }} noValidate>

    <${Fld} id="w-use" label="O que você quer automatizar?"><select id="w-use" class="ca-field" value=${w.use || 'Landing pages'} onChange=${e => self.setWait({ use: e.target.value })}>${['Landing pages', 'Telas de app', 'E-mail marketing', 'Geração em lote pela API', 'Outro uso'].map(o => html`<option>${o}</option>`)}</select><//>

/* confirmação genérica (excluir, encerrar, desconectar) */
function ConfirmSheet({ open, onClose, kicker, title, desc, label, danger, onConfirm, typeWord, note }) {
  const [txt, setTxt] = useState('');
  const [busy, setBusy] = useState(false);
  const ok = !typeWord || txt.trim().toUpperCase() === typeWord;

function ProjectDownload({ open, onClose, id }) {
  const p = useStore(s => s.projects.find(x => x.id === id));

  if (!p) return null;
  const run = async () => {
    if (!ok || prog != null) return;
    setProg(0);
    const ex = await exportRecord(p.title + '-versao.' + (p.mode === 'image' ? 'png' : 'mp4'), p.id);
    const d = recordDecl({ kind: 'download', mode: p.mode, title: p.title, items: ['download'], project: p.id, files: [ex.file], c2pa: ex.c2pa });
    const t0 = Date.now();
    while (Date.now() - t0 < 1200) { await sleep(60); setProg((Date.now() - t0) / 1200); }
    onClose(); setTimeout(() => toast('Download simulado · ' + d.id + '. No produto, o arquivo baixa aqui.', { ms: 5200 }), 240);
  };
  const ext = p.mode === 'image' ? 'png' : 'mp4';
  return html`<${Sheet} open=${open} onClose=${onClose} labelledBy="pd-t" size="sm" dismiss=${prog == null}>

function PixQR({ seed }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const N = 29, S = 6, x = c.getContext('2d'), r = rng(seedOf(seed || 'pix'));
    c.width = N * S; c.height = N * S;
    const ink = getComputedStyle(c).color || '#1D1E20';
    x.clearRect(0, 0, c.width, c.height); x.fillStyle = ink;
    const finder = (cx0, cy0) => { x.fillRect(cx0 * S, cy0 * S, 7 * S, 7 * S); x.clearRect((cx0 + 1) * S, (cy0 + 1) * S, 5 * S, 5 * S); x.fillRect((cx0 + 2) * S, (cy0 + 2) * S, 3 * S, 3 * S); };
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const inF = (i < 8 && j < 8) || (i > N - 9 && j < 8) || (i < 8 && j > N - 9);
      if (!inF && r() > 0.52) x.fillRect(i * S, j * S, S, S);
    }
    finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  }, [seed]);
  return html`<canvas ref=${ref} class="ca-qr" role="img" aria-label="QR Code de demonstração. Não use para pagar."></canvas>`;
}

  const dirty = fields.some(k => (f[k] || '') !== (u[k] || ''));
  const set = (k, val) => { setF(x => Object.assign({}, x, { [k]: val })); setErr(e => Object.assign({}, e, { [k]: '' })); };
  const save = async () => {
    const e = {};
    if (f.name.trim().length < 2) e.name = 'Digite o seu nome.';
    if (!/^[a-z0-9_.]{3,24}$/.test(f.username)) e.username = 'Use de 3 a 24 caracteres: letras minúsculas, números, ponto ou sublinhado.';
    if (f.phone && f.phone.replace(/\D/g, '').length < 10) e.phone = 'Digite o telefone com DDD.';
    setErr(e); if (Object.keys(e).length) return;
    setBusy(true); await sleep(700);
    setSession(se => ({ user: Object.assign({}, se.user, f) }));
    setBusy(false); toast('Perfil salvo.');
  };

    <div class="ca-sheet__body" style="justify-items:center">
      <div class="ca-crop" style=${{ width: S + 'px', height: S + 'px' }} onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}>
        <img src=${url} alt="" draggable="false" onLoad=${e => setNat({ w: e.target.naturalWidth, h: e.target.naturalHeight })} style=${nat ? { width: nat.w * base * z + 'px', height: nat.h * base * z + 'px', transform: 'translate(calc(-50% + ' + pos.x + 'px), calc(-50% + ' + pos.y + 'px))' } : { opacity: 0 }} />

  <//>`;

    } else if (choice === 'anual') {
      setSession(se => ({ plan: Object.assign({}, se.plan, { status: 'cancelada', renews: monthEnd.toISOString(), cancelReason: reason, cancelAt: at, next: null }) }));
      store.set(st => ({ invoices: [{ id: 'ES-' + code(6), at, desc: 'Reembolso · Plano ' + plan.name + ' (' + plural(monthsLeft, 'mês', 'meses') + ')', value: -annualRefund, status: 'estornada' }].concat(st.invoices) }));

      notify('Assinatura cancelada', 'Protocolo ' + prot + '. O plano ' + plan.name + ' fica ativo até ' + fmtDMY(sp.renews) + '.', 'assinatura');
      onClose(); setTimeout(() => toast('Assinatura cancelada · ' + prot + '. O ' + plan.name + ' segue ativo até ' + fmtDMY(sp.renews) + '.', { ms: 6000 }), 230);

/* créditos e uso */
function UsageChart({ ledger }) {
  const days = 14, now = new Date(); now.setHours(0, 0, 0, 0);
  const buckets = Array.from({ length: days }, (_, i) => ({ d: addDays(now, i - days + 1), v: 0 }));
  ledger.forEach(l => { if (l.amount >= 0 || l.kind === 'estorno') return; const d = new Date(l.at); d.setHours(0, 0, 0, 0); const i = Math.round((d - buckets[0].d) / 86400000); if (i >= 0 && i < days) buckets[i].v += -l.amount; });
  ledger.forEach(l => { if (l.kind !== 'estorno') return; const d = new Date(l.at); d.setHours(0, 0, 0, 0); const i = Math.round((d - buckets[0].d) / 86400000); if (i >= 0 && i < days) buckets[i].v = Math.max(0, buckets[i].v - l.amount); });
  const max = Math.max(...buckets.map(b => b.v), 1);
  const step = max <= 50 ? 10 : max <= 100 ? 25 : max <= 200 ? 50 : max <= 400 ? 100 : max <= 1000 ? 250 : 500;
  const top = Math.ceil(max / step) * step;
  const ticks = []; for (let t = 0; t <= top; t += step) ticks.push(t);
  const [hov, setHov] = useState(-1);
  const total = buckets.reduce((a, b) => a + b.v, 0);
  return html`<figure class="ca-chart">
    <figcaption class="ca-chart__cap"><span>Créditos usados por dia · últimos 14 dias</span><span class="ca-mono">${fmtInt(total)} no período</span></figcaption>
    <div class="ca-chart__plot" onMouseLeave=${() => setHov(-1)}>
      <div class="ca-chart__grid" aria-hidden="true">${ticks.slice().reverse().map(t => html`<div class="ca-chart__tick"><span>${fmtInt(t)}</span></div>`)}</div>
      <div class="ca-chart__bars">
        ${buckets.map((b, i) => html`<div class=${cx('ca-chart__col', hov === i && 'is-hov')} key=${i} tabindex="0" role="img" aria-label=${fmtDay(b.d) + ': ' + plural(b.v, 'crédito', 'créditos')}
          onMouseEnter=${() => setHov(i)} onFocus=${() => setHov(i)} onBlur=${() => setHov(-1)}>
          <i style=${{ height: (b.v / top * 100) + '%' }}></i>
          ${hov === i && html`<span class=${cx('ca-chart__tip', i > days - 4 && 'is-left', i < 2 && 'is-right')} style=${{ bottom: 'calc(' + (b.v / top * 100).toFixed(2) + '% + 8px)' }}><b>${fmtInt(b.v)}</b> créditos<br />${fmtDay(b.d)}</span>`}
        </div>`)}
      </div>
      <div class="ca-chart__x" aria-hidden="true">${buckets.map((b, i) => html`<span>${i % 3 === 1 || i === days - 1 ? (i === days - 1 ? 'hoje' : fmtDay(b.d)) : ''}</span>`)}</div>
    </div>
  </figure>`;
}

function Receipt({ open, onClose, id }) {
  const d = useStore(s => s.declarations.find(x => x.id === id));
  const email = useStore(s => s.session ? s.session.user.email : '');
  if (!d) return html`<${Sheet} open=${open} onClose=${onClose} label="Comprovante" size="sm"><${SheetHead} title="Comprovante não encontrado" desc="Este registro não está neste navegador." /><//>`;
  const text = ['Beatframe · comprovante de declaração', 'ID: ' + d.id, 'Tipo: ' + (DECL_KIND[d.kind] || d.kind), 'Data: ' + fmtBrasilia(d.at), 'Conta: ' + email, 'IP: ' + d.ip, 'Dispositivo: ' + d.device, 'Termos: v' + d.version]
    .concat(d.basis ? ['Base: ' + BASIS_LABEL[d.basis]] : [])
    .concat(d.track && d.track.lib ? ['Trilha: ' + d.track.name + ' · certificado ' + d.track.lic] : [])
    .concat(d.c2pa ? ['Procedência (C2PA): ' + d.c2pa] : [])
    .concat(['', 'Declarado:'].concat((d.items || []).map(it => '- ' + (DECL_TEXT[it] || it))))
    .concat((d.files || []).length ? ['', 'Arquivos:'].concat(d.files.map(f => '- ' + f.name + (f.size ? ' (' + fmtBytes(f.size) + ')' : '') + ' · ' + (f.algo || 'SHA-256') + ' ' + f.hash)) : []).join('\n');
  return html`<${Sheet} open=${open} onClose=${onClose} labelledBy="rc-t" size="lg">
    <${SheetHead} id="rc-t" kicker="comprovante de declaração" title=${d.id} desc=${(DECL_KIND[d.kind] || d.kind) + ' · ' + fmtBrasilia(d.at)} />
    <div class="ca-sheet__body">

        <dt>ip</dt><dd class="ca-mono">${d.ip}</dd>

        <dt>termos</dt><dd class="ca-mono">v${d.version}</dd>
        ${d.basis && html`<${Fragment}><dt>${d.zone === 'ref' ? 'uso da referência' : 'base'}</dt><dd>${BASIS_LABEL[d.basis]}</dd><//>`}
        ${d.track && d.track.lib && html`<${Fragment}><dt>trilha</dt><dd>Biblioteca licenciada · <span class="ca-mono ca-nowrap">${d.track.lic}</span> <button type="button" class="ca-link ca-link--sm" onClick=${() => { closeOverlay(); setTimeout(() => openOverlay('license', { decl: d.id }), 230); }}>Ver certificado</button></dd><//>`}
        ${d.c2pa && html`<${Fragment}><dt>procedência</dt><dd class="ca-mono" style="word-break:break-all">${d.c2pa}</dd><//>`}
        ${d.cost && html`<${Fragment}><dt>geração</dt><dd class="ca-mono">${d.res} · ${plural(d.cost, 'crédito', 'créditos')}</dd><//>`}
      </dl>
      <div><p class="ca-kicker" style="margin-bottom:8px">declarado</p><ul class="ca-done">${(d.items || []).map((it, i) => html`<li style=${{ '--i': i }}><b>[ok]</b><span>${DECL_TEXT[it] || it}</span></li>`)}</ul></div>
      ${(d.files || []).length > 0 && html`<div><p class="ca-kicker" style="margin-bottom:8px">arquivos · impressão digital</p><div class="ca-tablewrap"><table class="ca-table"><thead><tr><th>arquivo</th><th>tamanho</th><th>hash</th></tr></thead>
        <tbody>${d.files.map(f => html`<tr><td>${f.name}</td><td class="ca-mono">${f.size ? fmtBytes(f.size) : '—'}</td><td class="ca-mono" title=${(f.algo || 'SHA-256') + ' ' + f.hash}>${(f.hash || '').slice(0, 16)}…<span style="color:var(--ink-3)"> ${f.algo && f.algo !== 'SHA-256' ? '· ' + f.algo.replace('SHA-256', '').replace(/^ · /, '') : ''}</span></td></tr>`)}</tbody></table></div></div>`}
      <p class="ca-sheet__legal" style="margin:0">Guardamos este registro por 5 anos após o encerramento da conta, para o exercício regular de direitos. No produto, o servidor registra o IP completo, recalcula as impressões digitais e envia uma cópia deste comprovante para o seu e-mail.</p>
    </div>
    <div class="ca-sheet__foot"><${Btn} kind="line" onClick=${() => copyText(text, 'Comprovante copiado.')}>Copiar comprovante<//><${Btn} kind="primary" onClick=${onClose}>Fechar<//></div>
  <//>`;
}

function Contact() {
  const session = useStore(s => s.session);
  const projects = useStore(s => s.projects);

  const [err, setErr] = useState({});
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);
  const set = (k, v) => { setF(x => Object.assign({}, x, { [k]: v })); setErr(e => Object.assign({}, e, { [k]: '' })); };
  const submit = async e => {
    e.preventDefault();
    const er = {};
    if (!emailOk(f.mail)) er.mail = 'Digite um e-mail válido para a resposta.';
    if (f.msg.trim().length < 12) er.msg = 'Conte um pouco mais. Pelo menos 12 caracteres.';

    setBusy(true); await sleep(1000);
    const t = { id: protocolo('CA'), at: new Date().toISOString(), subject: f.subject, mail: f.mail, status: 'aberto' };
    store.set(s => ({ tickets: [t].concat(s.tickets || []) }));
    setBusy(false); setDone(t);
  };
  return html`<div class="ca-wrap ca-page">
    <${PageHead} kicker="suporte" title="Fale com a gente" lede=${'Respondemos por e-mail em até 1 dia útil, ' + EMPRESA.horario + '. Todo atendimento gera um número de protocolo.'} />

            <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><${Btn} kind="line" size="sm" onClick=${() => { setDone(null); setF(x => Object.assign({}, x, { msg: '', file: '' })); }}>Abrir outro chamado<//><${Btn} kind="ghost" size="sm" onClick=${go('ajuda')}>Voltar à ajuda<//></div>
          </div>` : html`<form class="ca-form" onSubmit=${submit} noValidate key="form">

            </div>
            ${session && projects.length > 0 && html`<${Fld} id="ct-proj" label="Versão relacionada" opt><select id="ct-proj" class="ca-field" value=${f.proj} onChange=${e => set('proj', e.target.value)}><option value="">Nenhuma</option>${projects.map(p => html`<option value=${p.id}>${p.title}</option>`)}</select><//>`}
            <${Fld} id="ct-msg" label="Mensagem" extra=${f.msg.length + '/2000'} err=${err.msg}><textarea id="ct-msg" class="ca-field" rows="6" maxlength="2000" value=${f.msg} onInput=${e => set('msg', e.target.value)} placeholder="Conte o que aconteceu e o que você esperava."></textarea><//>

const REPORT_KINDS = {
  autoral: { l: 'Uso de obra, música ou marca', d: 'Direitos autorais, conexos ou de marca.', who: [['titular', 'Titular dos direitos', 'Autor ou dono da obra.'], ['representante', 'Representante autorizado', 'Advogado, agência ou gravadora com procuração.'], ['outro', 'Outra pessoa', 'Vamos analisar como alerta.']] },
  imagem: { l: 'Uso da minha imagem ou voz', d: 'Alguém usou o seu rosto, a sua voz ou o seu nome sem autorização.', who: [['retratado', 'A pessoa que aparece', 'É a sua imagem ou a sua voz.'], ['representante', 'Representante ou responsável legal', 'Procurador ou responsável por criança ou adolescente.'], ['outro', 'Outra pessoa', 'Vamos analisar como alerta.']] },
  urgente: { l: 'Nudez sem consentimento, criança ou adolescente, ameaça', d: 'Prioridade máxima. Não informamos seus dados a quem publicou.', who: [['retratado', 'A pessoa que aparece', ''], ['responsavel', 'Responsável legal', ''], ['outro', 'Outra pessoa', 'Qualquer pessoa pode avisar.']] }
};
function Report() {
  const session = useStore(s => s.session);
  const [f, setF] = useState({ kind: '', who: '', name: session ? session.user.name : '', mail: session ? session.user.email : '', company: '', target: '', work: '', workUrl: '', desc: '', sign: '', c1: false, c2: false, c3: false });
  const [tried, setTried] = useState(false);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);
  const set = (k, v) => setF(x => Object.assign({}, x, { [k]: v }));
  const K = REPORT_KINDS[f.kind];
  const urgent = f.kind === 'urgente', autoral = f.kind === 'autoral';
  const asAlert = f.who === 'outro';
  const errs = {
    kind: !f.kind && 'Escolha o tipo de denúncia.',
    who: !!f.kind && !f.who && 'Escolha uma opção.',
    name: !urgent && f.name.trim().length < 3 && 'Digite o seu nome completo.',
    mail: !emailOk(f.mail) && 'Digite um e-mail válido para receber o protocolo.',
    target: f.target.trim().length < 4 && 'Informe onde está o conteúdo.',
    work: autoral && f.work.trim().length < 8 && 'Descreva a obra protegida.',
    desc: f.desc.trim().length < 20 && 'Explique em pelo menos 20 caracteres.',
    sign: !urgent && (norm(f.sign.trim()) !== norm(f.name.trim()) || !f.sign.trim()) ? 'A assinatura precisa ser igual ao nome completo.' : '',
    checks: urgent ? (!f.c2 && 'Marque a declaração.') : !(f.c1 && f.c2 && f.c3) && 'Marque as três declarações.'
  };
  const ok = !Object.values(errs).some(Boolean);
  const e = k => (tried ? errs[k] || '' : '');
  const submit = async ev => {
    ev.preventDefault(); setTried(true); if (!ok) return;
    setBusy(true); await sleep(1100);
    const t = { id: protocolo(urgent ? 'UR' : f.kind === 'imagem' ? 'IM' : 'DA'), at: new Date().toISOString(), subject: urgent ? 'Denúncia prioritária' : f.kind === 'imagem' ? 'Uso de imagem ou voz' : 'Notificação de direitos autorais', mail: f.mail, status: urgent ? 'prioridade' : 'em análise', kind: f.kind };
    store.set(s => ({ tickets: [t].concat(s.tickets || []) }));
    setBusy(false); setDone(t);
  };
  const c1 = f.kind === 'imagem' ? 'Declaro de boa-fé que não autorizei esse uso da minha imagem ou voz, nem a pessoa que represento.' : 'Declaro de boa-fé que o uso descrito não foi autorizado pelo titular, por representante ou pela lei.';
  const c3 = asAlert ? 'Entendo que, sem ser titular ou representante, a notificação vale como alerta e podemos pedir a participação de quem tem o direito.' : f.kind === 'imagem' ? 'Sou a pessoa retratada ou estou autorizado a agir em nome dela.' : 'Sou titular dos direitos ou estou autorizado a agir em nome do titular.';
  return html`<div class="ca-wrap ca-page">
    <${PageHead} kicker="denúncia" title="Denunciar violação de direitos" lede="Se um conteúdo feito no Beatframe usa uma obra sua, a sua imagem ou a sua voz sem autorização, envie a notificação abaixo." />
    <ol class="ca-flow ca-in" style="--i:3">
      <li><span>[01]</span><b>Notificação</b><p>Você diz onde está o conteúdo e o que foi violado.</p></li>
      <li><span>[02]</span><b>Análise</b><p>Respondemos em até 2 dias úteis. Nudez sem consentimento, crianças e ameaças saem do ar assim que confirmamos.</p></li>
      <li><span>[03]</span><b>Resposta</b><p>Quem publicou pode contestar em até 10 dias úteis. Três notificações válidas em 12 meses encerram a conta.</p></li>
    </ol>
    <div class="ca-helpgrid">
      <section class="ca-acard" aria-label="Formulário de notificação">
        <div class="ca-acard__body" style="padding-top:22px">
          ${done ? html`<div class="ca-done-box">
            <p class="ca-kicker">${done.kind === 'urgente' ? 'denúncia prioritária recebida' : 'notificação recebida'}</p>
            <p class="ca-h2" style="margin-top:8px">Protocolo ${done.id}</p>
            <p class="ca-small" style="margin-top:8px">${done.kind === 'urgente'
              ? 'O conteúdo sai do ar assim que confirmarmos que ele está na plataforma, sem esperar o prazo de análise. Não informamos o seu nome nem o seu contato a quem publicou. Em caso de risco imediato, procure também a polícia (190).'
              : 'Vamos analisar em até 2 dias úteis e responder em ' + done.mail + '. Se a notificação estiver completa, o conteúdo pode ficar indisponível durante a análise.'}</p>
            <div style="margin-top:18px"><${Btn} kind="line" size="sm" onClick=${go('ajuda')}>Voltar à ajuda<//></div>
          </div>` : html`<form class="ca-form" onSubmit=${submit} noValidate>
            <${Fld} label="O que você quer denunciar" err=${e('kind')}><div class="ca-radios" role="radiogroup" aria-label="Tipo de denúncia">${Object.keys(REPORT_KINDS).map(k => html`<${Radio} key=${k} name="kind" value=${k} on=${f.kind === k} onChange=${v => setF(x => Object.assign({}, x, { kind: v, who: '', c1: false, c3: false }))} label=${REPORT_KINDS[k].l} sub=${REPORT_KINDS[k].d} />`)}</div><//>
            ${K && html`<${Fragment}>
            ${urgent && html`<div class="ca-note ca-note--warn"><span><b>Prioridade.</b> Esta denúncia não precisa de prova de titularidade nem de assinatura. Em caso de risco imediato a alguém, ligue 190.</span></div>`}

function onProseClick(e, inDrawer) {

}
function LegalBody({ doc, inDrawer, onSec }) {

    ${doc.sections.map(s => html`<section class="ca-legal__sec" id=${(inDrawer ? 'dr-' : 'lg-') + s.id} key=${s.id} data-sec=${s.id}>
      <h2>${s.title}</h2>

function LegalPage({ slug }) {
  const doc = legalDoc(slug);
  const [active, setActive] = useState(doc && doc.sections[0] ? doc.sections[0].id : '');
  const L = window.CA_LEGAL || LEGAL_FALLBACK;
  useEffect(() => {
    if (!doc) return;
    let io;
    try {
      io = new IntersectionObserver(ents => { const vis = ents.filter(x => x.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top); if (vis[0]) setActive(vis[0].target.getAttribute('data-sec')); }, { rootMargin: '-18% 0px -70% 0px' });
      document.querySelectorAll('.ca-legal__doc [data-sec]').forEach(el => io.observe(el));
    } catch (e) {}
    return () => { if (io) io.disconnect(); };
  }, [slug]);
  if (!doc) return html`<${NotFound} />`;
  const jump = id => { const el = document.getElementById('lg-' + id); if (el) { el.scrollIntoView({ behavior: isReduced() ? 'auto' : 'smooth', block: 'start' }); setActive(id); } };
  return html`<div class="ca-wrap ca-page ca-legal">
    <nav class="ca-crumb ca-in" style="--i:0" aria-label="Você está em"><a href="#legal" onClick=${go('legal')}>Termos e políticas</a><span aria-hidden="true">/</span><span>${doc.short || doc.title}</span></nav>
    <div class="ca-legal__grid">
      <aside class="ca-legal__toc">
        <label class="ca-sr" for="lg-switch">Trocar de documento</label>
        <select id="lg-switch" class="ca-field ca-legal__switch" value=${slug} onChange=${e => navigate(e.target.value)}>${legalDocs().map(d => html`<option value=${d.slug}>${d.title}</option>`)}</select>
        <p class="ca-kicker">neste documento</p>
        <ol>${doc.sections.map(s => html`<li><button type="button" class=${active === s.id ? 'is-on' : ''} onClick=${() => jump(s.id)}>${s.title}</button></li>`)}</ol>
      </aside>
      <article class="ca-legal__doc">
        <p class="ca-kicker ca-in" style="--i:1">${doc.kicker}</p>
        <h1 class="ca-h1 ca-in" style="--i:2">${doc.title}</h1>
        <p class="ca-legal__meta ca-in" style="--i:3"><span class="ca-mono">v${L.version} · vigente desde ${L.updated}</span><span class="ca-tag ca-tag--warn">minuta para revisão jurídica</span></p>
        <div class="ca-in" style="--i:4"><${LegalBody} doc=${doc} /></div>
        <footer class="ca-legal__foot">
          <p class="ca-small">Dúvidas sobre este documento: <span class="ca-mono">${EMPRESA.mail.juridico}</span>. Privacidade: <span class="ca-mono">${EMPRESA.mail.privacidade}</span>.</p>
          <div class="ca-legal__others">${legalDocs().filter(d => d.slug !== slug).map(d => html`<a class="ca-legal__card" href=${'#' + d.slug} onClick=${go(d.slug)}><span class="ca-kicker">${d.kicker}</span><b>${d.title}</b><${Icon} n="arrow-right" cls="ca-i--sm" /></a>`)}</div>
        </footer>
      </article>
    </div>
  </div>`;
}

/* assistente de suporte (simulado) */
function SupportChat({ open, onClose }) {
  const session = useStore(s => s.session);
  const [msgs, setMsgs] = useState(() => [{ id: 'm0', who: 'bot', text: 'Oi' + (session ? ', ' + session.user.name.split(' ')[0] : '') + '. Sou o assistente do Beatframe. Posso ajudar com créditos, direitos, cobrança e conta. Se preferir, chamo uma pessoa do time.' }]);
  const [txt, setTxt] = useState('');
  const [typing, setTyping] = useState(false);
  const listRef = useRef(null);
  useEffect(() => { const el = listRef.current; if (el) el.scrollTop = el.scrollHeight; }, [msgs, typing]);
  const reply = async q => {
    const t = q.trim(); if (!t) return;
    setMsgs(m => m.concat([{ id: uid(), who: 'me', text: t }])); setTxt('');
    setTyping(true); await sleep(900 + Math.random() * 500);
    let a;
    if (/pessoa|humano|atendente|algu[eé]m/i.test(t)) {
      const tk = { id: protocolo('CA'), at: new Date().toISOString(), subject: 'Conversa com o assistente', mail: session ? session.user.email : '', status: 'aberto' };
      store.set(s => ({ tickets: [tk].concat(s.tickets || []) }));
      a = 'Abri o chamado ' + tk.id + '. Uma pessoa do time responde ' + (session ? 'em ' + session.user.email : 'por e-mail') + ' em até 1 dia útil, ' + EMPRESA.horario + '.';
    } else { const hit = BOT.find(b => b.k.test(t)); a = hit ? hit.a : 'Ainda não sei responder isso. Quer que eu chame uma pessoa do time? Escreva “falar com uma pessoa”.'; }
    setTyping(false);
    setMsgs(m => m.concat([{ id: uid(), who: 'bot', text: a }]));
  };
  const quick = ['Como funcionam os créditos?', 'Posso usar música famosa?', 'Como cancelo?', 'Falar com uma pessoa'];
  return html`<${Drawer} open=${open} onClose=${onClose} title="Assistente do Beatframe" labelId="ch-t"
    foot=${html`<form class="ca-chat__in" onSubmit=${e => { e.preventDefault(); reply(txt); }}><label class="ca-sr" for="ch-in">Mensagem</label><input id="ch-in" class="ca-field" value=${txt} onInput=${e => setTxt(e.target.value)} placeholder="Escreva a sua dúvida" autocomplete="off" data-autofocus /><${Btn} kind="primary" type="submit" label="Enviar" disabled=${!txt.trim()}><${Icon} n="arrow-right" /><//></form>`}>
    <div class="ca-chat" ref=${listRef} aria-live="polite">
      <p class="ca-mono ca-chat__note">assistente automático · respostas da central de ajuda · demonstração</p>
      ${msgs.map(m => html`<div key=${m.id} class=${'ca-msg ca-msg--' + m.who}><p>${m.text}</p></div>`)}
      ${typing && html`<div class="ca-msg ca-msg--bot ca-msg--typing" aria-label="Digitando"><span></span><span></span><span></span></div>`}
      <div class="ca-chat__quick">${quick.map(q => html`<button type="button" class="ca-sug" onClick=${() => reply(q)}>${q}</button>`)}</div>
    </div>
  <//>`;
}

  checkout: Checkout, cookies: CookiePrefs, legal: LegalReader, onboarding: Onboarding, receipt: Receipt,
  chat: SupportChat, photo: PhotoEditor, email: ChangeEmail, password: PasswordSheet, twofa: TwoFASheet,
  cancel: CancelSheet, cardsheet: CardSheet, confirm: ConfirmSheet, project: ProjectDrawer, projmenu: ProjMenu, pdownload: ProjectDownload, license: TrackLicense
};
function GlobalOverlay() {
  const o = useStore(s => s.ui.overlay);
  if (!o) return null;
  const C = OVERLAYS[o.type];
  if (!C) return null;
  return html`<${C} key=${o.id} ...${o.props} open=${o.open} onClose=${closeOverlay} />`;
}
function Page({ route }) {
  const R = ROUTES[route] || ROUTES['nao-encontrada'];
  if (route === 'entrar') return html`<${AuthPage} />`;
  if (R.ws) return html`<${Workspace} mode=${R.ws} />`;
  if (R.acct) return html`<${Account} tab=${R.acct} />`;
  if (R.legal === '') return html`<${LegalHub} />`;
  if (R.legal) return html`<${LegalPage} slug=${R.legal} key=${R.legal} />`;
  switch (route) {
    case 'projetos': return html`<${Projects} />`;
    case 'planos': return html`<${Plans} />`;
    case 'ajuda': return html`<${Help} />`;
    case 'contato': return html`<${Contact} />`;
    case 'denunciar': return html`<${Report} />`;
    case 'status': return html`<${Status} />`;
    case 'sobre': return html`<${About} />`;
    default: return html`<${NotFound} />`;
  }
}
function App() {
  const route = useStore(s => s.route);
  const authed = useStore(s => !!s.session);
  const R = ROUTES[route] || {};
  const shell = R.shell === 'none' ? 'none' : (authed ? 'app' : 'public');
  const Tag = shell === 'none' ? 'div' : 'main';
  return html`<div class="ca">
    <a class="ca-skip" href="#ca-conteudo" onClick=${e => { e.preventDefault(); const m = document.getElementById('ca-conteudo'); if (m) m.focus(); }}>Pular para o conteúdo</a>
    ${shell === 'app' && html`<${Nav} />`}
    ${shell === 'public' && html`<${PublicHeader} />`}
    <${Tag} class=${cx('pg', NAV_VT && 'is-vt')} key=${route} id=${shell === 'none' ? undefined : 'ca-conteudo'} tabindex=${shell === 'none' ? undefined : '-1'}>
      <${Page} route=${route} />
    <//>
    ${shell !== 'none' && !R.ws && html`<${Footer} />`}
    <${GlobalOverlay} />
    <${CookieBanner} />
    <${Toaster} />
  </div>`;
}

/* atalhos: ⌘K busca, ⌘⇧L tema */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && !e.shiftKey && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    const o = store.get().ui.overlay;
    if (o && o.type === 'cmdk' && o.open) closeOverlay(); else openOverlay('cmdk');
  } else if (mod && e.shiftKey && (e.key === 'l' || e.key === 'L')) {
    e.preventDefault(); toggleTheme();
  }
});

/* início: preloader espera fontes e o vídeo da entrada, depois sobe como cortina */
function boot() {
  const pl = document.getElementById('ca-preload');
  if (pl) pl.classList.add('is-ok');
  applyTheme();
  const s = store.get();
  const t = (location.hash || '').replace(/^#/, '');
  const first = t && ROUTES[t] ? t : (t ? t : (s.session ? 'criar-video' : 'entrar'));
  const r = resolveRoute(first, s);
  if (r.missing) LAST_MISSING = r.missing;
  store.set({ route: r.route, next: r.next || null });
  syncHash(r.route, true);
  try { document.title = (ROUTES[r.route].title || 'Beatframe') + ' · Beatframe'; } catch (e) {}
  document.documentElement.classList.add('is-booting');
  render(html`<${App} />`, document.getElementById('app'));
  if (!pl) { document.documentElement.classList.remove('is-booting'); BOOT.active = false; return; }
  const pct = pl.querySelector('.pl__pct'), bar = pl.querySelector('.pl__bar i'), tc = pl.querySelector('.pl__tc');
  const t0 = performance.now();
  let shown = 0, target = 34, finished = false, stop = false;
  const frame = () => {
    shown = Math.min(target, shown + Math.max(0.35, (target - shown) * 0.1));
    if (pct) pct.textContent = pad3(Math.floor(shown)) + '%';
    if (bar) bar.style.setProperty('--p', String(shown / 100));
    if (tc) tc.textContent = fmtTC((performance.now() - t0) / 1000);
    if (!stop) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  const finish = () => {
    if (finished) return; finished = true;
    target = 100;
    setTimeout(() => {
      stop = true;
      if (pct) pct.textContent = '100%';
      if (bar) bar.style.setProperty('--p', '1');
      pl.classList.add('is-out');
      document.documentElement.classList.remove('is-booting');
      BOOT.active = false;
      setTimeout(() => { pl.classList.add('is-gone'); }, 760);
    }, 320);
  };
  const waits = [sleep(isReduced() ? 300 : 1450)];
  if (document.fonts && document.fonts.ready) waits.push(document.fonts.ready.then(() => { target = Math.max(target, 72); }).catch(() => {}));
  if (r.route === 'entrar') waits.push(Promise.race([heroReady(), sleep(3600)]).then(() => { target = Math.max(target, 92); }));
  Promise.all(waits).then(finish);
  setTimeout(finish, 6500);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
